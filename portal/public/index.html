  // ------------------------------------------------------- saf mantık -----
  // Deneme kodu: sınav seçimini (ve şık karıştırmasını) Math.random yerine bu
  // seed'li üretece bağlayınca, aynı seed + aynı mod + aynı bankayla aynı deneme
  // yeniden üretilebiliyor. mulberry32 — küçük, hızlı, tarayıcıda bağımlılıksız.
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function sampleRandom(arr, k, rnd) {
    rnd = rnd || Math.random;
    var copy = arr.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
    }
    return copy.slice(0, Math.min(k, copy.length));
  }

  function weightedSample(arr, k, weightFn, rnd) {
    rnd = rnd || Math.random;
    if (arr.length <= k) return arr.slice();
    var withKeys = arr.map(function (item) {
      var w = Math.max(weightFn(item), 1e-9);
      return { item: item, key: Math.pow(rnd(), 1 / w) };
    });
    withKeys.sort(function (a, b) { return b.key - a.key; });
    return withKeys.slice(0, k).map(function (x) { return x.item; });
  }

  function weightedOrder(arr, weightFn, rnd) {
    // weightedSample'ın "arr.length<=k ise sırasız döndür" kısayolunu atlayan tam
    // sürümü — havuzun TAMAMINI ağırlığa göre rastgele sıralar (kuyruk kurarken kullanılır).
    rnd = rnd || Math.random;
    var withKeys = arr.map(function (item) {
      var w = Math.max(weightFn(item), 1e-9);
      return { item: item, key: Math.pow(rnd(), 1 / w) };
    });
    withKeys.sort(function (a, b) { return b.key - a.key; });
    return withKeys.map(function (x) { return x.item; });
  }

  // Rastgele Soru (flashSecimYap) ve Sırayla kuyruğu (pratikKuyrukOlustur) ortak

  // sıklıkla, doğru geçmişliler en seyrek ama YİNE DE sıfır olmayan ihtimalle

  function soruAgirligi(guid, statlar) {

    if (s && s.sonSonucDogruMu === false) return 6;
    if (s && s.sonSonucDogruMu === true) return 1;

  function shuffleSiklarInPlace(q, rnd) {
    // Ezber olmasın diye her oturumda soru şıklarını yeniden karıştırır — kalıcı
    // guid-shuffle (data üretiminde yapılan) değil, o SORU BU OTURUMDA seçildiğinde
    // taze bir sıra (rnd verilmezse Math.random). q, STATE.bank/STATE.practiceBank'taki
    // gerçek objeye referans olduğu için doğrudan mutasyon yeterli: skorlama ve gözden
    // geçirme ekranları hep aynı canlı objeyi okuyor, ekstra bir eşleme gerekmiyor.
    rnd = rnd || Math.random;
    var dogruMetin = q.siklar[q.cevapIdx];
    var karisik = q.siklar.slice();
    for (var i = karisik.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = karisik[i]; karisik[i] = karisik[j]; karisik[j] = tmp;
    }
    q.siklar = karisik;
    q.cevapIdx = karisik.indexOf(dogruMetin);
    q.cevapHarf = ["A", "B", "C", "D"][q.cevapIdx];
  }

  function pickExamQuestions(state, mode, rnd) {
    rnd = rnd || Math.random;
    var dagilim = state.settings.dagilim;
    var sorular = [];
    var uyarilar = [];
    Object.keys(dagilim).forEach(function (konu) {
      var k = dagilim[konu];
      if (!k) return;
      var havuz = state.bank.filter(function (q) { return q.konu === konu; });
      var secim = [];
      if (mode === "rastgele") {
        secim = sampleRandom(havuz, k, rnd);
      } else if (mode === "azgorulen") {
        secim = weightedSample(havuz, k, function (q) {
          var g = (state.stats[q.guid] && state.stats[q.guid].gosterim) || 0;
          return 1 / Math.pow(1 + g, 2);
        }, rnd);
      } else if (mode === "yanlislar") {
        var yanlisHavuz = havuz.filter(function (q) {
          return state.stats[q.guid] && state.stats[q.guid].sonSonucDogruMu === false;
        });
        secim = sampleRandom(yanlisHavuz, Math.min(k, yanlisHavuz.length), rnd);
        if (secim.length < k) {
          var secilen1 = {}; secim.forEach(function (q) { secilen1[q.guid] = true; });
          var denenmemis = havuz.filter(function (q) { return !secilen1[q.guid] && !state.stats[q.guid]; });
          secim = secim.concat(sampleRandom(denenmemis, k - secim.length, rnd));
        }
        if (secim.length < k) {
          var secilen2 = {}; secim.forEach(function (q) { secilen2[q.guid] = true; });
          var kalanHavuz = havuz.filter(function (q) { return !secilen2[q.guid]; });
          secim = secim.concat(weightedSample(kalanHavuz, k - secim.length, function (q) {
            var g = (state.stats[q.guid] && state.stats[q.guid].gosterim) || 0;
            return 1 / Math.pow(1 + g, 2);
          }, rnd));
        }
        if (secim.length < k) uyarilar.push(konu + ": havuzda yeterli soru yok (" + secim.length + "/" + k + ")");
      }
      sorular = sorular.concat(secim);
    });
    return { sorular: sorular, uyarilar: uyarilar };
  }

  // Deneme kodu ↔ {mode, seed} — kısa, elle yazılabilir bir kod. Kodun kendisi
  // soru listesini TAŞIMAZ; aynı moddaki seçim algoritmasını aynı seed'le yeniden
  // çalıştırır. Bu yüzden yalnız banka bu iki deneme arasında büyük ölçüde
  // değişmediyse birebir aynı soruları garanti eder ("azgorulen"/"yanlislar"
  // modlarında ayrıca kişisel istatistikler de değişmemiş olmalı).
  var EXAM_MODE_KODU = { rastgele: "R", azgorulen: "A", yanlislar: "Y" };
  var EXAM_KODU_MOD = { R: "rastgele", A: "azgorulen", Y: "yanlislar" };
  function examKoduUret(mode, seed) {
    if (typeof seed !== "number" || !isFinite(seed)) return null;
    var harf = EXAM_MODE_KODU[mode] || "R";
    return "UZY-" + harf + (seed >>> 0).toString(36).toUpperCase();
  }
  function examKoduCoz(kodHam) {
    if (!kodHam) return null;
    var temiz = kodHam.trim().toUpperCase().replace(/^UZY-?/, "");
    var harf = temiz.charAt(0);
    var mode = EXAM_KODU_MOD[harf];
    var seedStr = temiz.slice(1);
    if (!mode || !seedStr || !/^[0-9A-Z]+$/.test(seedStr)) return null;
    var seed = parseInt(seedStr, 36);
    if (!isFinite(seed) || seed < 0) return null;
    return { mode: mode, seed: seed >>> 0 };
  }

  // Her oturum kendi soru/şık görüntüsünü korur; havuz güncellemeleri ve
  // sonraki karıştırmalar geçmiş cevap indekslerini değiştiremez.
  function soruKayitlari(bank, guids) {
    var out = {};
    bank.forEach(function (q) { if (guids.indexOf(q.guid) !== -1) out[q.guid] = JSON.parse(JSON.stringify(q)); });
    return out;
  }

  function oturumSorusu(oturum, bank, guid) {
    return (oturum && oturum.soruKayitlari && oturum.soruKayitlari[guid]) ||
      bank.filter(function (q) { return q.guid === guid; })[0];
  }

  function scoreExam(bank, sorular, cevaplar, kayitlar) {
    var konuKirilim = {};
    var dogru = 0, yanlis = 0, bos = 0;
    var bankByGuid = {};
    bank.forEach(function (q) { bankByGuid[q.guid] = q; });
    sorular.forEach(function (guid) {
      var q = (kayitlar && kayitlar[guid]) || bankByGuid[guid];
      if (!q) return;
      var secilen = cevaplar[guid];
      if (!konuKirilim[q.konu]) konuKirilim[q.konu] = { dogru: 0, yanlis: 0, bos: 0 };
      if (secilen === undefined || secilen === null) { bos++; konuKirilim[q.konu].bos++; }
      else if (secilen === q.cevapIdx) { dogru++; konuKirilim[q.konu].dogru++; }
      else { yanlis++; konuKirilim[q.konu].yanlis++; }
    });
    return { skor: { dogru: dogru, yanlis: yanlis, bos: bos }, konuKirilim: konuKirilim };
  }

  function pratikKapsamDisiMi(q) {
    return !!(STATE.flags[q.guid] && STATE.flags[q.guid].kapsamDisi);
  }

  function pratikHavuz(konu, modul) {
    // Kapsam dışı işaretlenen sorular gerçek silme (kullanıcı onayı) gelene kadar
    // havuzdan filtrelenir — tekrar karşısına çıkmasın, ama veri kaybolmasın.
    var tumu = modul === PRATIK_TUM_MODULLER
      ? STATE.practiceBank.filter(function (q) { return q.konu === konu; })
      : STATE.practiceBank.filter(function (q) { return q.konu === konu && q.modul === modul; });
    return tumu.filter(function (q) { return !pratikKapsamDisiMi(q); });
  }

  function azGorulenSirala(havuz) {
    // ⚠ Önce GÖSTERİM SAYISINA göre sıralanmıştı (en az gösterim önce) — ama gerçek veride
    // sayı TAM SAYI olduğu için sorular "tier" halinde kümeleniyor (ör. 6 tanesi gösterim=1,
    // 9 tanesi gösterim=2 gibi). Bir oturumda seçilen sorular yalnız BİR ARTTIĞI için bir
    // SONRAKİ tier'e düşüp o tier'deki hiç dokunulmamış sorularla YENİDEN eşit sıraya
    // geliyordu — rastgele kırılan bu eşitlikte az önce cevaplanmış sorular yine seçilebiliyordu
    // (M6'da 23 soru/cap 10 iken art arda iki oturum arası 5/10 çakışma ölçüldü, olması gereken
    // sıfırdı). Çözüm: SÜREKLİ bir anahtar — sonGorulme (zaman damgası). Az önce cevaplanan
    // bir sorunun sonGorulme'si "şimdi"ye atlar, yani havuzdaki HERKESTEN kesin olarak sonraya
    // düşer; tam sayı gibi komşularıyla yeniden eşitlenmez. Havuz oturum boyutunun en az iki
    // katıysa bu, art arda iki oturum arasında SIFIR çakışmayı garanti eder (kanıtlı, şansa
    // bağlı değil) — havuz daha küçükse de mümkün olan en az çakışmayı verir. Hiç görülmemiş
    // sorular (sonGorulme yok) en düşük anahtarla (0) en önde çıkar; eşitlik (yalnız
    // "hiç görülmemiş" grubunda olur) rastgele kırılır.
    var withKeys = havuz.map(function (q) {
      var s = STATE.pStats[q.guid];
      var t = (s && s.sonGorulme) ? Date.parse(s.sonGorulme) : 0;
      return { q: q, t: t, r: Math.random() };
    });
    withKeys.sort(function (a, b) { return (a.t - b.t) || (a.r - b.r); });
    return withKeys.map(function (x) { return x.q; });
  }

  var PRATIK_KARISIK_LIMIT = 20; // "Karışık — Tüm Modüller" her modda (Sırayla/Az Görülenler/Yanlışlar) 20 soruyla sınırlı
  var PRATIK_AZ_GORULEN_TEK_MODUL_LIMIT = 10; // tek modülde 20, modülün neredeyse tamamı demekti —
                                               // iki ardışık oturum gerçek anlamda dönsün diye küçültüldü

  function pratikKuyrukOlustur(konu, modul, mod) {
    var havuz = pratikHavuz(konu, modul);
    var sirali;
    if (mod === "az") {
      sirali = azGorulenSirala(havuz);
      if (modul !== PRATIK_TUM_MODULLER) sirali = sirali.slice(0, PRATIK_AZ_GORULEN_TEK_MODUL_LIMIT);
      // Karışık ise burada KIRPILMAZ — aşağıdaki PRATIK_KARISIK_LIMIT zaten 20'ye kırpıyor;
      // havuz (179/246) cap'in çok üstünde olduğu için deterministik sıralama tek başına
      // art arda oturumlar arasında çakışmayı zaten pratikte sıfıra indiriyor.
    } else if (mod === "yanlis") {
      // Eriyen kuyruk: yalnız o an yanlış duran sorular. Doğru işaretlenen bir soru
      // sonSonucDogruMu=true'ya döner ve bir SONRAKİ "Yanlışlar" oturumunda kendiliğinden
      // düşer — dolgu/diğer sorularla tamamlanmaz. Havuz tükenince buton zaten disabled olur
      // (bkz. renderPratikModul'daki yanlisSayisi), kullanıcı normal moda geçer.
      var yanlisHavuz = havuz.filter(function (q) { return STATE.pStats[q.guid] && STATE.pStats[q.guid].sonSonucDogruMu === false; });
      sirali = sampleRandom(yanlisHavuz, yanlisHavuz.length);
    } else {
      // "siray" — ağırlıklı rastgele sıralama (bkz. soruAgirligi): yanlış
      // geçmişliler öne eğilimli ama kesin blok değil, tüm havuz karışık kalır.
      sirali = weightedOrder(havuz, function (q) { return soruAgirligi(q.guid, STATE.pStats); });
    }
    if (modul === PRATIK_TUM_MODULLER) sirali = sirali.slice(0, PRATIK_KARISIK_LIMIT);
    sirali.forEach(function (q) { shuffleSiklarInPlace(q); }); // şıklar da her oturumda yeniden karışsın
    return sirali.map(function (q) { return q.guid; });
  }

  function pratikSoruBul(guid) {
    return oturumSorusu(currentPratik, STATE.practiceBank, guid);
  }

  // "Karışık — Tüm Modüller" oturumunda hangi modülden kaç doğru/yanlış yapıldığını
  // gösterir — tek modüllü oturumlarda tek satır çıkacağı için (zaten üstteki genel
  // skorla aynı bilgi) çağrılmaz.
  function pratikModulKirilimi(cp) {
    var kirilim = {};
    Object.keys(cp.cevaplar).forEach(function (guid) {
      var q = pratikSoruBul(guid);
      if (!q) return;
      if (!kirilim[q.modul]) kirilim[q.modul] = { dogru: 0, yanlis: 0 };
      if (cp.cevaplar[guid] === q.cevapIdx) kirilim[q.modul].dogru++; else kirilim[q.modul].yanlis++;
    });
    return kirilim;
  }

  function pratikOturumSkoru(cp) {
    var dogru = 0, yanlis = 0;
    Object.keys(cp.cevaplar).forEach(function (guid) {
      var q = pratikSoruBul(guid);
      if (!q) return;
      if (cp.cevaplar[guid] === q.cevapIdx) dogru++; else yanlis++;
    });
    return { dogru: dogru, yanlis: yanlis };
  }

  function pratikBestGuncelle(cp) {
    // Modül seçim ekranındaki özet artık KÜMÜLATİF değil (o hep büyüyordu, anlamlı bir
    // "skor" değildi) — tamamlanan bir oturumun sonucu, o modülün şimdiye kadarki EN İYİ
    // sonucuyla karşılaştırılıp gerekirse günceller. Karşılaştırma doğruluk yüzdesine göre;
    // eşitlikte daha çok soru cevaplanan oturum tercih edilir.
    var skor = pratikOturumSkoru(cp);
    var toplam = skor.dogru + skor.yanlis;
    if (toplam === 0) return;
    if (!STATE.pBest[cp.konu]) STATE.pBest[cp.konu] = {};
    var mevcut = STATE.pBest[cp.konu][cp.modul];
    var yeniPct = skor.dogru / toplam;
    var mevcutPct = mevcut ? mevcut.dogru / (mevcut.dogru + mevcut.yanlis) : -1;
    if (!mevcut || yeniPct > mevcutPct || (yeniPct === mevcutPct && toplam > (mevcut.dogru + mevcut.yanlis))) {
      STATE.pBest[cp.konu][cp.modul] = { dogru: skor.dogru, yanlis: skor.yanlis, toplam: toplam, tarihISO: new Date().toISOString() };
    }
  }

  function mergeBankOnImport(state, yeniSatirlar) {
    var eskiGuid = {}; state.bank.forEach(function (q) { eskiGuid[q.guid] = true; });
    var yeniGuidSet = {}; yeniSatirlar.forEach(function (r) { yeniGuidSet[r.guid] = true; });
    var eklendi = 0, guncellendi = 0;
    yeniSatirlar.forEach(function (r) {
      if (!state.stats[r.guid]) {
        state.stats[r.guid] = { gosterim: 0, dogru: 0, yanlis: 0, sonSonucDogruMu: null, sonGorulme: null };
        eklendi++;
      } else if (eskiGuid[r.guid]) {
        guncellendi++;
      }
    });
    var kaldirildi = 0;
    Object.keys(eskiGuid).forEach(function (guid) {
      if (!yeniGuidSet[guid]) {
        state.arsivIstatistik[guid] = state.stats[guid];
        delete state.stats[guid];
        kaldirildi++;
      }
    });
    state.bank = yeniSatirlar;
    Object.keys(dagilimKonulariniGuncelle(state, yeniSatirlar));
    return { eklendi: eklendi, guncellendi: guncellendi, kaldirildi: kaldirildi };
  }

  function dagilimKonulariniGuncelle(state, rows) {
    var gorulen = {};
    rows.forEach(function (r) {
      if (!(r.konu in state.settings.dagilim)) state.settings.dagilim[r.konu] = 0;
      gorulen[r.konu] = true;
    });
    return gorulen;
  }

  // ------------------------------------------------------- xlsx okuyucu ---
  function findEOCD(view, bytes) {
    var sig = 0x06054b50;
    var maxBack = Math.min(bytes.length, 65557);
    for (var i = bytes.length - 22; i >= bytes.length - maxBack && i >= 0; i--) {
      if (view.getUint32(i, true) === sig) return i;
    }
    throw new Error("EOCD bulunamadı — dosya bozuk veya .xlsx değil.");
  }
  function readCentralDirectory(view, bytes) {
    var eocd = findEOCD(view, bytes);
    var cdOffset = view.getUint32(eocd + 16, true);
    var cdCount = view.getUint16(eocd + 10, true);
    var entries = []; var p = cdOffset;
    var dec = new TextDecoder("utf-8");
    for (var i = 0; i < cdCount; i++) {
      if (view.getUint32(p, true) !== 0x02014b50) throw new Error("Central directory kaydı bozuk.");
      var compMethod = view.getUint16(p + 10, true);
      var compSize = view.getUint32(p + 20, true);
      var nameLen = view.getUint16(p + 28, true);
      var extraLen = view.getUint16(p + 30, true);
      var commentLen = view.getUint16(p + 32, true);
      var localHeaderOffset = view.getUint32(p + 42, true);
      var name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
      entries.push({ name: name, compMethod: compMethod, compSize: compSize, localHeaderOffset: localHeaderOffset });
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }
  function extractEntry(bytes, view, entry) {
    var lh = entry.localHeaderOffset;
    if (view.getUint32(lh, true) !== 0x04034b50) throw new Error("Local file header bozuk: " + entry.name);
    var nameLen = view.getUint16(lh + 26, true);
    var extraLen = view.getUint16(lh + 28, true);
    var dataStart = lh + 30 + nameLen + extraLen;
    var raw = bytes.subarray(dataStart, dataStart + entry.compSize);
    if (entry.compMethod === 0) return Promise.resolve(raw);
    if (entry.compMethod !== 8) return Promise.reject(new Error("Desteklenmeyen sıkıştırma: " + entry.name));
    if (typeof DecompressionStream === "undefined") {
      return Promise.reject(new Error("Bu tarayıcı .xlsx okumak için gereken DecompressionStream API'sini desteklemiyor. Güncel Chrome/Edge kullanın."));
    }
    var ds = new DecompressionStream("deflate-raw");
    var writer = ds.writable.getWriter();
    writer.write(raw); writer.close();
    var chunks = [];
    var reader = ds.readable.getReader();
    function pump() {
      return reader.read().then(function (res) {
        if (res.done) return;
        chunks.push(res.value);
        return pump();
      });
    }
    return pump().then(function () {
      var total = chunks.reduce(function (n, c) { return n + c.length; }, 0);
      var out = new Uint8Array(total);
      var off = 0;
      chunks.forEach(function (c) { out.set(c, off); off += c.length; });
      return out;
    });
  }
  function readXlsxFileMap(arrayBuffer) {
    var bytes = new Uint8Array(arrayBuffer);
    var view = new DataView(arrayBuffer);
    var entries = readCentralDirectory(view, bytes);
    var map = {};
    var chain = Promise.resolve();
    entries.forEach(function (e) {
      if (e.name.slice(-1) === "/") return;
      chain = chain.then(function () {
        return extractEntry(bytes, view, e).then(function (data) { map[e.name] = data; });
      });
    });
    return chain.then(function () { return map; });
  }

  function resolveRelsTarget(target) {
    var t = target.replace(/^\//, "");
    if (t.slice(0, 3) !== "xl/") t = "xl/" + t;
    return t;
  }

  function parseSheetXmlToRows(xmlText, sharedStrings) {
    var doc = new DOMParser().parseFromString(xmlText, "application/xml");
    var rowEls = Array.prototype.slice.call(doc.getElementsByTagName("row"));
    return rowEls.map(function (rowEl) {
      var out = {};
      var cells = Array.prototype.slice.call(rowEl.getElementsByTagName("c"));
      cells.forEach(function (c) {
        var ref = c.getAttribute("r") || "";
        var m = ref.match(/^[A-Z]+/);
        var colLetter = m ? m[0] : "";
        if (!colLetter) return;
        var type = c.getAttribute("t");
        var value = "";
        if (type === "s") {
          var vEl = c.getElementsByTagName("v")[0];
          var idx = vEl ? parseInt(vEl.textContent, 10) : -1;
          value = sharedStrings[idx] || "";
        } else if (type === "inlineStr") {
          var isEl = c.getElementsByTagName("is")[0];
          if (isEl) value = Array.prototype.slice.call(isEl.getElementsByTagName("t")).map(function (t) { return t.textContent; }).join("");
        } else {
          var v2 = c.getElementsByTagName("v")[0];
          value = v2 ? v2.textContent : "";
        }
        out[colLetter] = value;
      });
      return out;
    });
  }

  var REQUIRED_HEADERS = ["Konu", "Soru", "A", "B", "C", "D", "CevapHarf", "GUID"];

  function parseWorkbook(arrayBuffer) {
    return readXlsxFileMap(arrayBuffer).then(function (files) {
      var dec = new TextDecoder("utf-8");
      var parser = new DOMParser();

      var sharedStrings = [];
      if (files["xl/sharedStrings.xml"]) {
        var ssDoc = parser.parseFromString(dec.decode(files["xl/sharedStrings.xml"]), "application/xml");
        sharedStrings = Array.prototype.slice.call(ssDoc.getElementsByTagName("si")).map(function (si) {
          return Array.prototype.slice.call(si.getElementsByTagName("t")).map(function (t) { return t.textContent; }).join("");
        });
      }

      if (!files["xl/workbook.xml"]) throw new Error("Geçersiz .xlsx: xl/workbook.xml bulunamadı.");
      var wbDoc = parser.parseFromString(dec.decode(files["xl/workbook.xml"]), "application/xml");
      var relMap = {};
      if (files["xl/_rels/workbook.xml.rels"]) {
        var relsDoc = parser.parseFromString(dec.decode(files["xl/_rels/workbook.xml.rels"]), "application/xml");
        Array.prototype.slice.call(relsDoc.getElementsByTagName("Relationship")).forEach(function (rel) {
          relMap[rel.getAttribute("Id")] = resolveRelsTarget(rel.getAttribute("Target"));
        });
      }

      var sheetEls = Array.prototype.slice.call(wbDoc.getElementsByTagName("sheet"));
      var picked = null;
      for (var i = 0; i < sheetEls.length; i++) {
        var sheetEl = sheetEls[i];
        var rId = sheetEl.getAttribute("r:id") ||
          sheetEl.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
        var path = relMap[rId];
        if (!path || !files[path]) continue;
        var xml = dec.decode(files[path]);
        var rows = parseSheetXmlToRows(xml, sharedStrings);
        if (rows.length === 0) continue;
        var headerValues = Object.keys(rows[0]).map(function (k) { return rows[0][k]; });
        var hasAll = REQUIRED_HEADERS.every(function (h) { return headerValues.indexOf(h) !== -1; });
        if (hasAll) { picked = { name: sheetEl.getAttribute("name"), rows: rows }; break; }
      }
      if (!picked) throw new Error("Hiçbir sayfada beklenen sütun başlıkları bulunamadı (Konu, Soru, A, B, C, D, CevapHarf, GUID).");

      var headerRow = picked.rows[0];
      var colToName = {};
      Object.keys(headerRow).forEach(function (colLetter) { colToName[colLetter] = headerRow[colLetter]; });
      var dataRows = picked.rows.slice(1).map(function (r) {
        var obj = {};
        Object.keys(r).forEach(function (colLetter) {
          var name = colToName[colLetter];
          if (name) obj[name] = r[colLetter];
        });
        return obj;
      }).filter(function (r) { return (r["Soru"] || "").trim() !== ""; });

      return { rows: dataRows, sheetName: picked.name };
    });
  }

  function rowsToBankFormat(rawRows) {
    var HARF_IDX = { A: 0, B: 1, C: 2, D: 3 };
    var out = [];
    rawRows.forEach(function (r) {
      var guid = ((r["GUID"] || "") + "").trim();
      var soru = ((r["Soru"] || "") + "").trim();
      var konu = ((r["Konu"] || "") + "").trim();
      var harf = ((r["CevapHarf"] || "") + "").trim().toUpperCase();
      if (!guid || !soru || !konu || !(harf in HARF_IDX)) return;
      var siklar = [r["A"], r["B"], r["C"], r["D"]].map(function (v) { return ((v || "") + "").trim(); });
      out.push({
        guid: guid, konu: konu, soru: soru, siklar: siklar,
        cevapIdx: HARF_IDX[harf], cevapHarf: harf,
        cevapMetni: ((r["CevapMetni"] || siklar[HARF_IDX[harf]] || "") + "").trim(),
        aciklama: ((r["Aciklama"] || "") + "").trim(),
        kaynak: ((r["Kaynak"] || "") + "").trim(),
        donem: ((r["Donem"] || "") + "").trim(),
        dogrulanmis: ((r["Dogrulanmis"] || "") + "").trim().toLowerCase() === "evet"
      });
    });
    return out;
  }

  // ------------------------------------------------------------ kalıcılık --
  function ensureArtifact() {
    if (artifactNs !== undefined) return Promise.resolve(artifactNs);
    if (typeof window.claude === "undefined" || typeof window.claude.use !== "function") {
      artifactNs = null; return Promise.resolve(null);
    }
    return window.claude.use("artifact").then(function (ns) { artifactNs = ns || null; return artifactNs; })
      .catch(function () { artifactNs = null; return null; });
  }

  function buildFullHtml(state) {
    var styleText = document.getElementById("app-style").textContent;
    var scriptText = document.getElementById("app-script").textContent;
    return "<!doctype html>\n<html lang=\"tr\">\n<head>\n<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>UZYET</title>\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n" +
      "<link href=\"https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n" +
      "<script src=\"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js\"><\/script>\n" +
      "<style id=\"app-style\">" + styleText + "</style>\n</head>\n<body>\n" +
      "<script id=\"app-state\" type=\"application/json\">" + JSON.stringify(state) + "<\/script>\n" +
      "<div id=\"app\"></div>\n" +
      "<script id=\"app-script\">" + scriptText + "<\/script>\n</body>\n</html>";
  }

  function stashPendingView() {
    // publish() sayfayı yeniden yüklüyor; bu olmazsa VIEW menüye sıfırlanır
    // (sınav ortasında bayrak işaretlemek veya Rastgele Soru'da cevap vermek bile kullanıcıyı menüye fırlatırdı).
    try {
      sessionStorage.setItem("uzyet_pending_view", JSON.stringify({
        view: VIEW, lastResult: lastResult, currentExam: currentExam, currentFlash: currentFlash,
        lastFlashResult: lastFlashResult,
        currentPratik: currentPratik, pratikSeciliKonu: pratikSeciliKonu, pratikSeciliModul: pratikSeciliModul
      }));
    } catch (e) { /* sessionStorage kullanılamıyor olabilir, sorun değil */ }
  }

  function saveAndPublish() {
    // Yayınlanan HTML ile localStorage anlık görüntüsü hep AYNI rev'i taşısın — böylece
    // reload sonrası "hangisi yeni" karşılaştırması (lsYukle) yanlış tarafa düşmez.
    bumpRev();
    lsKaydet();
    return ensureArtifact().then(function (artifact) {
      if (!artifact) {
        // sadeceDeneme derlemesi (Vercel'de statik dosya) hiçbir zaman Artifact içinde
        // çalışmaz — bu normal, kullanıcıyı alarma gerek yok (resmi deneme zaten sunucuda).
        if (!STATE.sadeceDeneme) showBanner("Kaydetme kullanılamıyor — bu görünümde kayıt yetkisi yok. Değişiklikler yalnızca bu tarayıcıda saklanıyor.", true);
        return false;
      }
      stashPendingView();
      return artifact.publish(buildFullHtml(STATE)).then(function () { return true; }).catch(function (e) {
        if (e && e.code === "conflict") return true; // sayfa zaten yeniden yükleniyor
        showBanner("Kaydetme hatası: " + (e && e.message ? e.message : e), true);
        return false;
      });
    });
  }

  // --------------------------------------------------------------- eylemler
  function fmtSure(saniye) {
    var dk = Math.floor(saniye / 60), sn = saniye % 60;
    return (dk < 10 ? "0" : "") + dk + ":" + (sn < 10 ? "0" : "") + sn;
  }
  function tickExamTimer() {
    if (VIEW !== "exam" || !currentExam) return;
    currentExam.gecenSaniye = (currentExam.gecenSaniye || 0) + 1;
    var el = document.getElementById("exam-timer");
    if (!el) return;
    el.textContent = "⏱ " + fmtSure(currentExam.gecenSaniye);
    el.style.color = currentExam.gecenSaniye >= 3600 ? "var(--bad)" : currentExam.gecenSaniye >= 3000 ? "var(--warn)" : "";
  }

  // ---- Resmi Deneme portalı (Neon/Vercel) ---------------------------------
  // Yalnız 50 soru/60 dk resmi deneme moduna (Yeni Sınav/Az Görülenler/Yanlışlar)
  // dokunur. Rastgele Soru, Konu Konu Bak, Test/Checkpoint sayfaları tamamen
  // yerel kalır — STATE.stats/STATE.history bu moddan hiç etkilenmez, resmi
  // deneme istatistiği/geçmişi sunucuda (hesaba bağlı) tutulur.
  var REMOTE_API = "https://uzyet-portal.vercel.app";
  var REMOTE_TOKEN_KEY = "uzyet_portal_token";
  // TODO: kullanıcı gerçek metni verince buraya yazılacak — şimdilik yer tutucu.
  var DISCLAIMER_METNI = "Bu, gerçek sınavın simülasyonudur; sorular ve açıklamalar UZYET ekibi tarafından hazırlanmıştır, resmi kaynak yerine geçmez. Kendi sorumluluğunda kullan.";
  var remoteAuth = { checked: false, checking: false, authenticated: false, username: null, isActive: false, disclaimerAccepted: false };
  var remoteDash = null;
  var remoteBusy = false;
  // Kayıt formu her render()'da sıfırdan kurulduğu için, hatalı gönderim sonrası
  // yazılanların kaybolmaması için taslak burada tutulur (input dinleyicisi doldurur).
  var denemeIsimTaslak = "";
  var denemePinTaslak = "";
  // "Yeni Sınav" vb. tıklandığında sınav hemen başlamaz — önce paylaşılabilir kod
  // gösterilir, "Sınava Başla" ile aynı kod (dolayısıyla "rastgele" modda aynı 50
  // soru) sunucuda oluşturulur. {mode, seed, kod} veya null.
  var denemeKodOnizleme = null;

  function remoteToken() { try { return localStorage.getItem(REMOTE_TOKEN_KEY); } catch (e) { return null; } }
  function remoteSetToken(t) { try { if (t) localStorage.setItem(REMOTE_TOKEN_KEY, t); } catch (e) { /* localStorage kapalıysa oturum sekme kapanana kadar bellekte kalır */ } }

  function remoteFetch(path, method, body) {
    var headers = { "Content-Type": "application/json" };
    var tok = remoteToken();
    if (tok) headers["Authorization"] = "Bearer " + tok;
    return fetch(REMOTE_API + path, { method: method || "GET", headers: headers, body: body ? JSON.stringify(body) : undefined })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
      });
  }

  function remoteRefreshDashboard(cb) {
    remoteFetch("/api/exam", "POST", { action: "dashboard" }).then(function (r) {
      remoteDash = r.ok ? r.data : null;
    }).catch(function () { remoteDash = null; }).then(function () { if (cb) cb(); });
  }

  var remoteBankLoaded = false;
  // sadeceDeneme derlemesi soru bankasını HTML'e hiç gömmez (bkz. build_quiz_dist.py
  // --sadece-deneme) — Rastgele Soru/Konu Konu Bak'ın çalışması için giriş+onay+disclaimer
  // tamamlanınca sunucudan (cevaplarıyla birlikte) çekilir. Onaysız/girişsiz ziyaretçi
  // view-source yapsa bile STATE.bank boş kalır.
  function remoteLoadBankIfNeeded(cb) {
    if (!STATE.sadeceDeneme || remoteBankLoaded || !remoteGirisTamamMi()) { if (cb) cb(); return; }
    remoteFetch("/api/exam", "POST", { action: "bank" }).then(function (r) {
      if (r.ok && r.data && r.data.questions) { STATE.bank = r.data.questions; remoteBankLoaded = true; }
    }).catch(function () {}).then(function () { if (cb) cb(); });
  }

  // Hatırlatıcı olarak işaretlenmiş soruların guid listesi — cihazlar arası kalıcı
  // olsun diye sunucudan çekilir (bkz. /api/exam {action:'reminders'}), STATE.flags
  // gibi yalnız localStorage'a bağlı kalmaz.
  var remoteReminderGuids = null;
  function remoteLoadReminders(cb) {
    if (!STATE.sadeceDeneme || !remoteGirisTamamMi()) { if (cb) cb(); return; }
    remoteFetch("/api/exam", "POST", { action: "reminders" }).then(function (r) {
      if (r.ok && r.data && r.data.guids) remoteReminderGuids = r.data.guids;
    }).catch(function () {}).then(function () { if (cb) cb(); });
  }

  // Tamamlanan denemelerde son sonucu yanlış olan sorular. Hatırlatıcılardan
  // farklı olarak bu havuz elle işaretlenmez: deneme sonucu ile dolar, kendi
  // tekrar testinde doğru çözülünce sunucudaki question_stats güncellenir ve erir.
  var remoteWrongGuids = null;
  function remoteLoadWrongQuestions(cb) {
    if (!STATE.sadeceDeneme || !remoteGirisTamamMi()) { if (cb) cb(); return; }
    remoteFetch("/api/exam", "POST", { action: "wrong-questions" }).then(function (r) {
      if (r.ok && r.data && r.data.guids) remoteWrongGuids = r.data.guids;
    }).catch(function () {}).then(function () { if (cb) cb(); });
  }

  // STATE.flags (🔖 Hatırlatıcı, 🚩 hatalı+kategori, not) yalnız bu tarayıcının
  // localStorage'ında tutuluyordu — başka bir cihaz/tarayıcıdan devam edilince
  // sunucudaki kayıt dururken yerelde hiç görünmüyordu ("Denemeden çıkıp geri
  // devam diyince işaretli sorular yok oluyor" — kullanıcı bildirimi, 8 Eyl 2026).
  // Girişte bir kez sunucudaki gerçek durumu STATE.flags'e yazar (yalnız sunucunun
  // bildiği alanları — begenildi/kapsamDisi gibi yerel-yalnız alanlara dokunmaz).
  var remoteFlagsLoaded = false;
  function remoteLoadFlagsIfNeeded(cb) {
    if (!STATE.sadeceDeneme || remoteFlagsLoaded || !remoteGirisTamamMi()) { if (cb) cb(); return; }
    remoteFetch("/api/exam", "POST", { action: "flags" }).then(function (r) {
      if (r.ok && r.data && r.data.flags) {
        Object.keys(r.data.flags).forEach(function (guid) {
          var f = r.data.flags[guid];
          var local = STATE.flags[guid] || bosFlagKaydi();
          local.hatali = f.hatali; local.kategori = f.kategori; local.hataNotu = f.hataNotu; local.hatirlatici = f.hatirlatici;
          STATE.flags[guid] = local;
        });
        remoteFlagsLoaded = true;
        veriDegisti();
      }
    }).catch(function () {}).then(function () { if (cb) cb(); });
  }

  // Deneme dashboard'ı, (giriş tamamsa) soru bankasını, hatırlatıcı/yanlış
  // listelerini ve gerçek işaret durumunu birlikte tazeler.
  function afterAuthStateChange(cb) {
    var pending = 0, done = false;
    function finish() { pending--; if (pending <= 0 && !done) { done = true; if (cb) cb(); } }
    if (remoteAuth.isActive) { pending++; remoteRefreshDashboard(finish); }
    if (remoteGirisTamamMi() && !remoteBankLoaded) { pending++; remoteLoadBankIfNeeded(finish); }
    if (remoteGirisTamamMi() && remoteReminderGuids === null) { pending++; remoteLoadReminders(finish); }
    if (remoteGirisTamamMi() && remoteWrongGuids === null) { pending++; remoteLoadWrongQuestions(finish); }
    if (remoteGirisTamamMi() && !remoteFlagsLoaded) { pending++; remoteLoadFlagsIfNeeded(finish); }
    if (pending === 0 && cb) cb();
  }

  function remoteCheckStatus(cb) {
    if (!remoteToken()) {
      remoteAuth = { checked: true, checking: false, authenticated: false, username: null, isActive: false, disclaimerAccepted: false };
      if (cb) cb();
      return;
    }
    remoteAuth.checking = true;
    remoteFetch("/api/access", "GET").then(function (r) {
      if (r.ok && r.data && r.data.authenticated) {
        remoteAuth = { checked: true, checking: false, authenticated: true, username: r.data.username, isActive: !!r.data.isActive, disclaimerAccepted: !!r.data.disclaimerAccepted };
      } else {
        remoteAuth = { checked: true, checking: false, authenticated: false, username: null, isActive: false, disclaimerAccepted: false };
      }
    }).catch(function () {
      remoteAuth = { checked: true, checking: false, authenticated: false, username: null, isActive: false, disclaimerAccepted: false };
    }).then(function () {
      afterAuthStateChange(cb);
    });
  }

  function openMenuDeneme() {
    VIEW = "menuDeneme";
    render();
    if (!remoteAuth.checked) remoteCheckStatus(function () { if (VIEW === "menuDeneme") render(); });
  }

  function remoteRegisterSubmit() {
    if (remoteBusy) return;
    var username = denemeIsimTaslak.trim().toLocaleLowerCase("tr-TR");
    var pin = denemePinTaslak.trim();
    if (!username) { showBanner("İsim gerekli.", true); return; }
    if (!/^[a-z0-9._-]{3,40}$/.test(username)) {
      showBanner("İsim 3-40 karakter olmalı; yalnız küçük harf, rakam, nokta, tire, alt çizgi (boşluk/Türkçe karakter olmadan).", true);
      return;
    }
    if (!/^\d{4}$/.test(pin)) { showBanner("PIN 4 haneli rakam olmalı.", true); return; }
    remoteBusy = true; render();
    remoteFetch("/api/access", "POST", { username: username, pin: pin }).then(function (r) {
      remoteBusy = false;
      if (!r.ok) { showBanner((r.data && r.data.error) || "Kayıt başarısız.", true); render(); return; }
      denemeIsimTaslak = ""; denemePinTaslak = "";
      if (r.data.token) remoteSetToken(r.data.token);
      remoteAuth = { checked: true, checking: false, authenticated: true, username: r.data.username, isActive: !!r.data.isActive, disclaimerAccepted: !!r.data.disclaimerAccepted };
      render();
      afterAuthStateChange(render);
    }).catch(function () { remoteBusy = false; showBanner("Bağlantı hatası — internet bağlantını kontrol et.", true); render(); });
  }

  function remoteAcceptDisclaimer() {
    if (remoteBusy) return;
    remoteBusy = true; render();
    remoteFetch("/api/access", "POST", { acceptDisclaimer: true }).then(function (r) {
      remoteBusy = false;
      if (!r.ok) { showBanner((r.data && r.data.error) || "Kaydedilemedi, tekrar dene.", true); render(); return; }
      remoteAuth.disclaimerAccepted = !!r.data.disclaimerAccepted;
      render();
      afterAuthStateChange(render);
    }).catch(function () { remoteBusy = false; showBanner("Bağlantı hatası.", true); render(); });
  }

  function remoteRefreshStatus() {
    remoteAuth.checked = false;
    remoteCheckStatus(function () { render(); });
    render();
  }

  function denemeCikisYap() {
    localStorage.removeItem(REMOTE_TOKEN_KEY);
    remoteAuth = { checked: true, checking: false, authenticated: false, username: null, isActive: false, disclaimerAccepted: false };
    denemeIsimTaslak = "";
    denemePinTaslak = "";
    remoteDash = null;
    remoteBankLoaded = false;
    remoteReminderGuids = null;
    remoteWrongGuids = null;
    remoteFlagsLoaded = false;
    render();
  }

  // Uzak sınavın soru görüntüsünü yerel exam ekranıyla aynı şekle sokar. cevapIdx
  // placeholder'dır (-1) — renderExam() sınav bitmeden cevapIdx'i hiç okumaz;
  // gerçek değer yalnız finishExamRemote()'da, sunucu açıkladıktan sonra yazılır.
  function uzakSoruKayitlariOlustur(questions) {
    var out = {};
    questions.forEach(function (q) {
      out[q.guid] = {
        guid: q.guid, konu: q.topic, soru: q.prompt, siklar: q.options,
        cevapIdx: -1, cevapHarf: "", cevapMetni: "", aciklama: "", kaynak: "", donem: "", dogrulanmis: true,
        _attemptQuestionId: q.id
      };
    });
    return out;
  }

  function uzakExamKur(d) {
    currentExam = {
      tip: d.mode, uzak: true, uzakAttemptId: d.id, examCode: d.examCode,
      sorular: d.questions.map(function (q) { return q.guid; }),
      index: 0, cevaplar: d.answers || {}, uyarilar: [], gecenSaniye: d.elapsedSeconds || 0
    };
    currentExam.soruKayitlari = uzakSoruKayitlariOlustur(d.questions);
    VIEW = "exam";
  }

  function startExamRemote(mode, examCodeRaw) {
    if (remoteBusy) return;
    remoteBusy = true;
    var body = examCodeRaw ? { action: "start", mode: "rastgele", examCode: examCodeRaw } : { action: "start", mode: mode };
    remoteFetch("/api/exam", "POST", body).then(function (r) {
      remoteBusy = false;
      if (!r.ok) { showBanner((r.data && r.data.error) || "Sınav başlatılamadı.", true); render(); return; }
      uzakExamKur(r.data);
      render();
    }).catch(function () { remoteBusy = false; showBanner("Bağlantı hatası.", true); render(); });
  }

  function prepareExamRemote(mode) {
    if (remoteBusy) return;
    var seed = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
    denemeKodOnizleme = { mode: mode, seed: seed, kod: examKoduUret(mode, seed) };
    render();
  }
  function cancelExamKodOnizleme() { denemeKodOnizleme = null; render(); }
  function baslatExamKodOnizleme() {
    if (!denemeKodOnizleme) return;
    var d = denemeKodOnizleme;
    denemeKodOnizleme = null;
    startExamRemote(d.mode, d.kod);
  }

  function resumeExamRemote() {
    if (!remoteDash || !remoteDash.activeAttempt || remoteBusy) return;
    remoteBusy = true;
    remoteFetch("/api/exam", "POST", { action: "resume", attemptId: remoteDash.activeAttempt.id }).then(function (r) {
      remoteBusy = false;
      if (!r.ok) { showBanner((r.data && r.data.error) || "Sınav açılamadı.", true); render(); return; }
      uzakExamKur(r.data);
      render();
    }).catch(function () { remoteBusy = false; showBanner("Bağlantı hatası.", true); render(); });
  }

  var remoteDeleteConfirm = false;
  function requestDiscardExamRemote() { remoteDeleteConfirm = true; render(); }
  function cancelDiscardExamRemote() { remoteDeleteConfirm = false; render(); }
  function discardExamRemote() {
    if (!remoteDash || !remoteDash.activeAttempt || remoteBusy) return;
    remoteBusy = true;
    var attemptId = remoteDash.activeAttempt.id;
    remoteFetch("/api/exam", "POST", { action: "cancel", attemptId: attemptId }).then(function (r) {
      remoteBusy = false;
      remoteDeleteConfirm = false;
      if (!r.ok) { showBanner((r.data && r.data.error) || "Sınav silinemedi.", true); render(); return; }
      remoteDash = null;
      remoteRefreshDashboard(render);
    }).catch(function () { remoteBusy = false; showBanner("Bağlantı hatası.", true); render(); });
  }

  function remoteAnswerSync(guid, idx) {
    if (!currentExam || !currentExam.uzak) return;
    var q = currentExam.soruKayitlari[guid];
    if (!q) return;
    remoteFetch("/api/exam", "POST", {
      action: "answer", attemptId: currentExam.uzakAttemptId, questionId: q._attemptQuestionId, selectedIndex: idx
    }).catch(function () { /* sessizce geçilir — arayüzü bloklamaz, sınav bitince sunucu son cevaplarla tamamlanır */ });
  }

  function pauseExamRemote() {
    if (!currentExam || !currentExam.uzak) return;
    var attemptId = currentExam.uzakAttemptId;
    currentExam = null;
    VIEW = "menuDeneme";
    remoteDash = null;
    render();
    remoteFetch("/api/exam", "POST", { action: "pause", attemptId: attemptId }).then(function () {
      remoteRefreshDashboard(function () { if (VIEW === "menuDeneme") render(); });
    });
  }

  // 'finish' isteği zaten bitmiş bir denemede de idempotent çalışır (skor tekrar
  // uygulanmaz, yalnız review yeniden hesaplanıp döner) — bu yüzden hem sınavı yeni
  // bitirirken hem de geçmişten eski bir denemeyi tekrar açarken kullanılabilir.
  function uzakSonucKur(d) {
    var soruKayitlari = {};
    var konuKirilim = {};
    var cevaplar = {};
    (d.review || []).forEach(function (item) {
      soruKayitlari[item.guid] = {
        guid: item.guid, konu: item.topic, soru: item.prompt, siklar: item.options,
        cevapIdx: item.correctIndex, cevapHarf: ["A", "B", "C", "D"][item.correctIndex] || "",
        cevapMetni: item.options[item.correctIndex] || "", aciklama: item.explanation || "",
        kaynak: "", donem: "", dogrulanmis: true, _attemptQuestionId: item.id
      };
      if (item.selectedIndex !== null && item.selectedIndex !== undefined) cevaplar[item.guid] = item.selectedIndex;
      var k = konuKirilim[item.topic] || (konuKirilim[item.topic] = { dogru: 0, yanlis: 0, bos: 0 });
      if (item.isCorrect === true) k.dogru++; else if (item.isCorrect === false) k.yanlis++; else k.bos++;
    });
    lastResult = {
      id: d.id, tarihISO: d.updatedAt || new Date().toISOString(), tip: d.mode, seed: null, examCode: d.examCode, uzak: true,
      sorular: (d.review || []).map(function (item) { return item.guid; }),
      cevaplar: cevaplar, soruKayitlari: soruKayitlari,
      skor: { dogru: d.score.correct, yanlis: d.score.wrong, bos: d.score.blank },
      konuKirilim: konuKirilim, sureSaniye: d.elapsedSeconds || 0
    };
  }

  function finishExamRemote() {
    if (!currentExam || !currentExam.uzak || remoteBusy) return;
    remoteBusy = true;
    var attemptId = currentExam.uzakAttemptId;
    remoteFetch("/api/exam", "POST", { action: "finish", attemptId: attemptId }).then(function (r) {
      remoteBusy = false;
      if (!r.ok) { showBanner((r.data && r.data.error) || "Sınav bitirilemedi.", true); render(); return; }
      uzakSonucKur(r.data);
      currentExam = null;
      remoteDash = null;
      remoteWrongGuids = null;
      remoteLoadWrongQuestions();
      VIEW = "result";
      render();
    }).catch(function () { remoteBusy = false; showBanner("Bağlantı hatası.", true); render(); });
  }

  function openHistoryRemote() {
    VIEW = "gecmisUzak";
    render();
    remoteRefreshDashboard(render);
  }

  function openGecmisDetay(attemptId) {
    if (remoteBusy) return;
    remoteBusy = true; render();
    remoteFetch("/api/exam", "POST", { action: "finish", attemptId: attemptId }).then(function (r) {
      remoteBusy = false;
      if (!r.ok) { showBanner((r.data && r.data.error) || "Sınav açılamadı.", true); render(); return; }
      uzakSonucKur(r.data);
      VIEW = "result";
      render();
    }).catch(function () { remoteBusy = false; showBanner("Bağlantı hatası.", true); render(); });
  }

  var gecmisSilConfirmId = null;
  function requestDeleteGecmis(id) { gecmisSilConfirmId = id; render(); }
  function cancelDeleteGecmis() { gecmisSilConfirmId = null; render(); }
  function confirmDeleteGecmis(id) {
    if (remoteBusy) return;
    remoteBusy = true; render();
    remoteFetch("/api/exam", "POST", { action: "delete", attemptId: id }).then(function (r) {
      remoteBusy = false;
      gecmisSilConfirmId = null;
      if (!r.ok) { showBanner((r.data && r.data.error) || "Silinemedi.", true); render(); return; }
      remoteRefreshDashboard(render);
    }).catch(function () { remoteBusy = false; showBanner("Bağlantı hatası.", true); render(); });
  }

  function renderGecmisUzak() {
    var list = (remoteDash && remoteDash.recentAttempts) || [];
    var es = remoteDash && remoteDash.examStats;
    var ozetHtml = es ? '<div class="stat-grid">' +
      '<div class="stat-card"><div class="num">' + es.count + '</div><div class="lbl">Toplam deneme</div></div>' +
      '<div class="stat-card"><div class="num">' + es.avgCorrect + '/50</div><div class="lbl">Ortalama puan</div></div>' +
      '<div class="stat-card"><div class="num">' + fmtSure(es.avgSeconds) + '</div><div class="lbl">Ortalama süre</div></div>' +
      "</div>" : "";
    var rows = list.map(function (a) {
      var toplam = a.score ? (a.score.correct + a.score.wrong + a.score.blank) : a.totalCount;
      var skorTxt = a.score ? (a.score.correct + " / " + toplam + " · %" + a.score.percent) : "—";
      var renk = MOD_RENK[a.mode] || "var(--seri-6)";
      var silBlok = gecmisSilConfirmId === a.id
        ? '<span style="display:flex;gap:4px;flex-shrink:0">' +
          '<button class="btn primary" style="padding:2px 8px;font-size:0.78rem" data-action="confirm-delete-gecmis" data-id="' + a.id + '">Evet</button>' +
          '<button class="btn ghost" style="padding:2px 8px;font-size:0.78rem" data-action="cancel-delete-gecmis">Vazgeç</button>' +
          "</span>"
        : '<button class="btn ghost" style="padding:2px 8px;font-size:0.78rem;flex-shrink:0" data-action="request-delete-gecmis" data-id="' + a.id + '">Sil</button>';
      return '<div class="card" style="border-left:4px solid ' + renk + ';margin-bottom:10px;padding:14px 16px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">' +
        '<div style="cursor:pointer;flex:1" data-action="open-gecmis-detay" data-id="' + a.id + '">' +
        '<div class="title" style="font-weight:700">' + (MOD_ADI[a.mode] || a.mode) + '</div>' +
        '<div class="desc" style="color:var(--text-muted);font-size:0.86rem">' + fmtTarih(a.updatedAt) + " · ⏱ " + fmtSure(a.elapsedSeconds || 0) + " · " + skorTxt + "</div></div>" +
        silBlok +
        "</div></div>";
    }).join("");
    return '<div class="link-row"><button class="btn ghost" data-action="open-menu-deneme">← Deneme Sınavı</button></div>' +
      '<div class="section-title">📊 Deneme Geçmişi</div>' +
      ozetHtml +
      (list.length ? rows : '<div class="card">Henüz tamamlanmış resmi deneme yok.</div>');
  }

  // Yerel STATE.flags dual-write'ından sonra çağrılır; guid bir uzak deneme
  // sorusuna aitse (aktif sınav veya az önce bitmiş sonuç) sunucuya da bildirir,
  // değilse sessizce hiçbir şey yapmaz (yerel pratik/rastgele-soru bayrakları).
  // guid, STATE.sadeceDeneme'de her yerde (Deneme sınavı, sonuç incelemesi, Rastgele
  // Soru, Konu Konu Bak) aynı sunucu bankasına ait olduğundan sınıf/deneme bağlamına
  // bakılmadan doğrudan guid ile senkronlanır — önceki sürüm yalnız açık/az önce bitmiş
  // bir Deneme sınavı oturumunda çalışıyordu (kullanıcı isteği, 8 Eyl 2026).
  function remoteFlagSync(guid, note, kategori, hatali, hatirlatici) {
    if (!STATE.sadeceDeneme || !remoteGirisTamamMi()) return;
    remoteFetch("/api/exam", "POST", {
      action: "flag", questionGuid: guid, note: note || "", category: kategori || null,
      reported: !!hatali, reminder: !!hatirlatici
    }).then(function (r) {
      if (!r.ok || !remoteReminderGuids) return;
      var idx = remoteReminderGuids.indexOf(guid);
      if (hatirlatici && idx === -1) remoteReminderGuids.push(guid);
      else if (!hatirlatici && idx !== -1) remoteReminderGuids.splice(idx, 1);
    }).catch(function () {});
  }

  // Sınav ekranındaki hata bildirimi: serbest "Hatırlatıcı" yıldızı yok, yalnız
  // 🚩 + aşağıda sabit kategori seçenekleri — yönetici bunları kullanıcı+kategori
  // bazında raporlanan şekilde takip edip yarı manuel işleyecek.
  var HATA_KATEGORILERI = [
    { key: "soru", etiket: "Soru hatalı/anlaşılmıyor/sayılar güncel değil" },
    { key: "siklar", etiket: "Şıklar anlamsız/cevap şıklardan çıkıyor" },
    { key: "kapsam", etiket: "Bu konu kitaptan çıktı" }
  ];
  function setFlagKategori(guid, kategori) {
    if (!STATE.flags[guid]) STATE.flags[guid] = bosFlagKaydi();
    STATE.flags[guid].kategori = kategori;
    STATE.flags[guid].hatali = true;
    veriDegisti();
    render();
    remoteFlagSync(guid, STATE.flags[guid].hataNotu, kategori, true, STATE.flags[guid].hatirlatici);
  }
  // Kayıt/onay-bekleme/disclaimer adımları arkadaki içeriği (Rastgele Soru vb.)
  // etkileşimden kilitleyen tam ekran bir popup içinde gösterilir — sırayla aynı
  // görsel dilde ilerlesinler diye üçü de bu sarmalayıcıyı kullanır.
  function remoteGirisTamamMi() {
    return remoteAuth.checked && remoteAuth.authenticated && remoteAuth.isActive && remoteAuth.disclaimerAccepted;
  }

  function denemeModalSar(innerHtml) {
    // Sayfanın üstündeki normal .banner bu modalın ARKASINDA kalır (z-index) — hata/uyarı
    // mesajı modal açıkken görünmez olurdu, bu yüzden kart içine de ayrıca basılır.
    var bannerHtml = bannerMsg ? '<div class="banner' + (bannerIsError ? " error" : "") + '" style="margin-bottom:14px">' + escapeHtml(bannerMsg) + "</div>" : "";
    return '<div style="position:fixed;inset:0;z-index:9999;background:rgba(10,10,10,.62);display:flex;align-items:center;justify-content:center;padding:20px">' +
      '<div class="card" style="max-width:420px;width:100%;max-height:88vh;overflow:auto">' + bannerHtml + innerHtml + "</div></div>";
  }

  function renderDenemeUzakBolum() {
    if (!remoteAuth.checked || remoteAuth.checking) {
      return denemeModalSar("Hesap durumu kontrol ediliyor…");
    }
    if (!remoteAuth.authenticated) {
      var inputStil = "padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font-body)";
      return denemeModalSar(
        '<div class="section-title" style="font-size:1rem;margin-bottom:6px">Hoş geldin</div>' +
        '<div class="muted" style="margin-bottom:10px">Devam etmek için kayıt olman gerekiyor — isminizi yazmanız ve 4 haneli bir PIN belirlemeniz yeterli (boşluksuz isim, örn. <i>mustafa</i>). Bu PIN\'i unutma: başka bir cihazdan aynı isim ve PIN ile tekrar girebilirsin. Yönetici onayından sonra kullanabilirsin.</div>' +
        '<div class="link-row">' +
        '<input type="text" id="deneme-username-input" placeholder="isminiz" value="' + escapeHtml(denemeIsimTaslak) + '" style="flex:1;min-width:160px;' + inputStil + '"' + (remoteBusy ? " disabled" : "") + '>' +
        '<input type="text" inputmode="numeric" maxlength="4" id="deneme-pin-input" placeholder="PIN (4 hane)" value="' + escapeHtml(denemePinTaslak) + '" style="width:110px;' + inputStil + '"' + (remoteBusy ? " disabled" : "") + '>' +
        '<button class="btn primary" data-action="deneme-register" ' + (remoteBusy ? "disabled" : "") + '>' + (remoteBusy ? "Gönderiliyor…" : "Kayıt Ol / Giriş Yap") + "</button>" +
        "</div>");
    }
    if (!remoteAuth.isActive) {
      return denemeModalSar(
        '<div class="section-title" style="font-size:1rem;margin-bottom:6px">Onay bekleniyor</div>' +
        '<div class="muted" style="margin-bottom:10px">İsmin: <b>' + escapeHtml(remoteAuth.username) + '</b> — yönetici onayladığında devam edebilirsin.</div>' +
        '<button class="btn ghost" data-action="deneme-refresh">Durumu Yenile</button> ' +
        '<button class="btn ghost" data-action="deneme-cikis-yap">Vazgeç / Çıkış Yap</button>');
    }
    if (!remoteAuth.disclaimerAccepted) {
      return denemeModalSar(
        '<div class="section-title" style="font-size:1rem;margin-bottom:6px">Önemli not</div>' +
        '<div class="muted" style="margin-bottom:14px;white-space:pre-wrap">' + escapeHtml(DISCLAIMER_METNI) + '</div>' +
        '<button class="btn primary" ' + (remoteBusy ? "disabled" : "") + ' data-action="deneme-accept-disclaimer">' + (remoteBusy ? "Kaydediliyor…" : "Anladım") + "</button>");
    }
    if (remoteDash && remoteDash.activeAttempt) {
      var a = remoteDash.activeAttempt;
      var aksiyonlar = remoteDeleteConfirm
        ? '<div class="banner error" style="margin:10px 0">Bu sınav kalıcı olarak silinecek, emin misin?</div>' +
          '<div class="link-row">' +
          '<button class="btn primary" data-action="confirm-discard-exam-remote">Evet, sil</button>' +
          '<button class="btn ghost" data-action="cancel-discard-exam-remote">Vazgeç</button>' +
          "</div>"
        : '<div class="link-row" style="margin-top:10px">' +
          '<button class="btn primary" data-action="resume-exam-remote">Devam Et</button>' +
          '<button class="btn ghost" data-action="discard-exam-remote">Sil</button>' +
          "</div>";
      return '<div class="card resume-card">' +
        '<div class="title">Yarım kalan resmi deneme — ' + MOD_ADI[a.mode] + "</div>" +
        '<div class="desc">' + a.answeredCount + " / " + a.totalCount + " soru cevaplanmış</div>" +
        aksiyonlar +
        "</div>";
    }
    if (denemeKodOnizleme) {
      var dko = denemeKodOnizleme;
      var farkliCikabilirNotu = dko.mode === "rastgele" ? "" :
        " (Az Görülenler/Yanlışlar kişisel istatistiğine bağlı olduğu için başkasında tam olarak aynı soruları vermeyebilir)";
      return '<div class="card">' +
        '<div class="section-title" style="font-size:1rem;margin-bottom:6px">' + (MOD_ADI[dko.mode] || dko.mode) + " — kod hazır</div>" +
        '<div class="muted" style="margin-bottom:10px">Sınava başlamadan önce bu kodu arkadaşınla paylaşabilirsin' + farkliCikabilirNotu + ". Başladığında 60 dakikalık süre işlemeye başlar." + "</div>" +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">' +
        '<b style="font-family:var(--font-display);font-size:1.3rem;letter-spacing:0.03em">' + dko.kod + '</b>' +
        '<button class="btn ghost" data-action="copy-exam-code" data-kod="' + dko.kod + '">📋 Kopyala</button>' +
        "</div>" +
        '<div class="link-row">' +
        '<button class="btn primary" data-action="baslat-exam-kod-onizleme">Sınava Başla</button>' +
        '<button class="btn ghost" data-action="cancel-exam-kod-onizleme">Vazgeç</button>' +
        "</div></div>";
    }
    var modes = ["rastgele", "azgorulen", "yanlislar"].map(function (mode) {
      var titles = { rastgele: "Yeni Sınav", azgorulen: "Az Görülenler", yanlislar: "Yanlışlar" };
      var descs = {
        rastgele: "Resmi dağılıma göre 50 soruluk rastgele deneme.",
        azgorulen: "Aynı dağılım, öncelik en az karşılaştığın sorularda.",
        yanlislar: "Aynı dağılım, öncelik son denemesinde yanlış yaptıkların."
      };
      var renk = MOD_RENK[mode];
      return '<button class="mode-btn" style="border-left:4px solid ' + renk + '" data-action="prepare-exam-remote" data-mode="' + mode + '">' +
        '<div class="title"><span class="mode-dot" style="background:' + renk + '"></span>' + titles[mode] + '</div><div class="desc">' + descs[mode] + "</div></button>";
    }).join("");
    var koduCardHtml = '<div class="card" style="margin-top:14px">' +
      '<div class="section-title" style="font-size:1rem;margin-bottom:6px">🔑 Kod ile Çöz</div>' +
      '<div class="muted" style="margin-bottom:10px">Bir denemenin sonuç ekranındaki kodu buraya girersen aynı soruları yeniden çözersin (Yeni Sınav kodları herkes için aynı soruları verir; Az Görülenler/Yanlışlar kişisel istatistiğe bağlıdır).</div>' +
      '<div class="link-row">' +
      '<input type="text" id="exam-code-input" placeholder="ör. UZY-R1K2M3P" style="flex:1;min-width:160px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font-body)">' +
      '<button class="btn primary" data-action="start-exam-code">Kodla Başla</button>' +
      "</div></div>";
    return '<div class="mode-grid">' + modes + "</div>" + koduCardHtml;
  }

  function startExam(mode, seedOverride) {
    if (remoteAuth.isActive) { startExamRemote(mode); return; }
    if (STATE.pausedExam) return; // menüde yarım kalan sınav varken mod butonları zaten disabled
    var seed = (typeof seedOverride === "number" && isFinite(seedOverride))
      ? (seedOverride >>> 0)
      : (Math.floor(Math.random() * 0xFFFFFFFF) >>> 0);
    var rnd = mulberry32(seed);
    var res = pickExamQuestions(STATE, mode, rnd);
    if (res.sorular.length === 0) { showBanner("Bu sınav için havuzda hiç soru yok.", true); return; }
    res.sorular.forEach(function (q) { shuffleSiklarInPlace(q, rnd); }); // şıklar her sınavda yeniden karışsın — ezber olmasın
    var karisikSirali = sampleRandom(res.sorular, res.sorular.length, rnd); // konu bloklarına göre sabit sırayı da kır
    currentExam = { tip: mode, seed: seed, sorular: karisikSirali.map(function (q) { return q.guid; }), index: 0, cevaplar: {}, uyarilar: res.uyarilar, gecenSaniye: 0 };
    currentExam.soruKayitlari = soruKayitlari(STATE.bank, currentExam.sorular);
    VIEW = "exam";
    examDegisti();
    render();
  }
  function startExamWithCode() {
    var el = document.getElementById("exam-code-input");
    if (remoteAuth.isActive) { startExamRemote(null, el ? el.value : ""); return; }
    var cozum = examKoduCoz(el ? el.value : "");
    if (!cozum) { showBanner("Kod tanınmadı — sonuç ekranındaki kodu olduğu gibi kopyala.", true); return; }
    startExam(cozum.mode, cozum.seed);
  }
  function examSlotYaz() {
    if (!currentExam) return;
    STATE.pausedExam = JSON.parse(JSON.stringify(currentExam));
    STATE.pausedExam.savedAtISO = new Date().toISOString();
  }
  function examDegisti() { examSlotYaz(); veriDegisti(); }
  function selectOption(guid, idx) {
    currentExam.cevaplar[guid] = idx;
    if (currentExam.uzak) { remoteAnswerSync(guid, idx); render(); return; }
    examDegisti(); render();
  }
  function nextQuestion() {
    if (currentExam.index < currentExam.sorular.length - 1) currentExam.index++;
    if (currentExam.uzak) { render(); return; }
    examDegisti(); render();
  }
  function prevQuestion() {
    if (currentExam.index > 0) currentExam.index--;
    if (currentExam.uzak) { render(); return; }
    examDegisti(); render();
  }
  function gotoQuestion(idx) {
    currentExam.index = idx;
    if (currentExam.uzak) { render(); return; }
    examDegisti(); render();
  }

  function pauseExam() {
    if (currentExam && currentExam.uzak) { pauseExamRemote(); return; }
    examSlotYaz();
    currentExam = null;
    VIEW = "menu";
    pendingSaveDirty = false; // bu save zaten güncel STATE'in tamamını kaydediyor
    render();
    saveAndPublish();
  }
  function resumeExam() {
    if (!STATE.pausedExam) return;
    currentExam = {
      tip: STATE.pausedExam.tip, seed: STATE.pausedExam.seed, sorular: STATE.pausedExam.sorular, cevaplar: STATE.pausedExam.cevaplar,
      index: STATE.pausedExam.index, uyarilar: STATE.pausedExam.uyarilar || [],
      gecenSaniye: STATE.pausedExam.gecenSaniye || 0
    };
    currentExam.soruKayitlari = STATE.pausedExam.soruKayitlari || soruKayitlari(STATE.bank, currentExam.sorular);
    VIEW = "exam";
    render();
  }
  function requestDiscardPausedExam() { pausedDeleteConfirm = true; render(); }
  function cancelDiscardPausedExam() { pausedDeleteConfirm = false; render(); }
  function discardPausedExam() {
    STATE.pausedExam = null;
    pausedDeleteConfirm = false;
    pendingSaveDirty = false; // bu save zaten güncel STATE'in tamamını kaydediyor
    render();
    saveAndPublish();
  }

  function bosFlagKaydi() { return { hatirlatici: false, hatali: false, hataNotu: "", begenildi: false, kapsamDisi: false }; }

  function toggleFlag(guid, kind) {
    if (!STATE.flags[guid]) STATE.flags[guid] = bosFlagKaydi();
    STATE.flags[guid][kind] = !STATE.flags[guid][kind];
    veriDegisti(); // anında yayınlamıyoruz — sınav ortasında bayrak basmak reload'ı tetikleyip
    render();      // hızlı ardından gelen cevap/sonraki-soru gibi aksiyonları geri sarıyordu
    if (kind === "hatali" || kind === "hatirlatici") { // guid uzak denemeye ait değilse remoteFlagSync sessizce no-op
      remoteFlagSync(guid, STATE.flags[guid].hataNotu, STATE.flags[guid].kategori, STATE.flags[guid].hatali, STATE.flags[guid].hatirlatici);
    }
  }
  function saveHataNotu(guid, text) {
    if (!STATE.flags[guid]) STATE.flags[guid] = bosFlagKaydi();
    STATE.flags[guid].hataNotu = text;
    veriDegisti();
    remoteFlagSync(guid, text, STATE.flags[guid].kategori, STATE.flags[guid].hatali, STATE.flags[guid].hatirlatici);
  }

  // ------------------------------------------------ Tekrar testleri (ortak) --
  // İki tekrar oturumu — 🔖 Hatırlatıcı (elle işaretlenen sorular) ve ❌ Yanlış
  // Sorular (tamamlanan denemelerde son cevabı yanlış olanlar) — aynı motoru
  // paylaşır. Mekanik, Test sayfasındaki Rastgele Soru ile birebir aynıdır
  // (9 Eyl 2026, kullanıcı isteği): cevap bir kez seçilir ve kilitlenir, üstte
  // "✅ Testi Bitir", altta "← Önceki Soru / Sonraki Soru →" ile kuyrukta serbestçe
  // gezilir (geri dönünce verilen cevap ve şık sırası korunur) ve oturum ders
  // kırılımlı bir özet ekranıyla biter. Rastgele Soru'dan tek farkı kuyruğun sonlu
  // olması (havuz kadar) ve yanlış turunda her cevabın sunucuya yazılması.
  // Soru içeriği STATE.bank'ten (girişten sonra çekilen tam banka) okunur, guid
  // listeleri remoteReminderGuids / remoteWrongGuids'ten gelir. İkisi de kişisel
  // sınav istatistiğine veya deneme geçmişine yazmaz.
  function hatirlaticiSoruBul(guid) {
    return STATE.bank.filter(function (b) { return b.guid === guid; })[0];
  }
  var TEKRAR_TUR = {
    hatirlatici: {
      etiket: "🔖 Hatırlatıcı", ozetBaslik: "Hatırlatıcı testi", yeniOturum: "Yeni Hatırlatıcı Oturumu",
      bosMesaj: "İşaretli soru bulunamadı.", kaydeder: false,
      guidler: function () { return remoteReminderGuids || []; }
    },
    yanlis: {
      etiket: "❌ Yanlış Soru", ozetBaslik: "Yanlış soru testi", yeniOturum: "Kalanları Çöz",
      bosMesaj: "Tekrar edilecek yanlış soru bulunamadı.", kaydeder: true,
      guidler: function () { return remoteWrongGuids || []; }
    }
  };
  // {tur, kuyruk:[guid...], konum, kayitlar:[{guid,secilen,dogru,kayit,kayitHatasi}]}
  // kayit: "" (gönderilmedi) | "bekliyor" | "tamam" | "hata" — yalnız kaydeden turda kullanılır.
  var currentTekrar = null;
  var lastTekrarSonuc = null; // {tur, oturum:[{konu,dogru}...], soruSayisi} — "Testi Bitir" özeti

  function startTekrarTest(tur) {
    var cfg = TEKRAR_TUR[tur];
    if (!cfg) return;
    var guids = cfg.guidler().filter(function (g) { return hatirlaticiSoruBul(g); });
    if (!guids.length) { showBanner(cfg.bosMesaj, true); return; }
    var kuyruk = sampleRandom(guids, guids.length);
    kuyruk.forEach(function (g) { shuffleSiklarInPlace(hatirlaticiSoruBul(g)); });
    currentTekrar = {
      tur: tur, kuyruk: kuyruk, konum: 0,
      kayitlar: kuyruk.map(function (g) { return { guid: g, secilen: null, dogru: null, kayit: "", kayitHatasi: "" }; })
    };
    lastTekrarSonuc = null;
    VIEW = "tekrarTest";
    render();
  }
  function tekrarAktifKayit() {
    return currentTekrar ? currentTekrar.kayitlar[currentTekrar.konum] : null;
  }
  function selectTekrarOption(idx) {
    var kayit = tekrarAktifKayit();
    if (!kayit || kayit.secilen !== null) return; // cevap zaten verildi, kilitli
    var q = hatirlaticiSoruBul(kayit.guid);
    if (!q || !q.siklar[idx]) return;
    kayit.secilen = idx;
    kayit.dogru = idx === q.cevapIdx;
    render();
    if (TEKRAR_TUR[currentTekrar.tur].kaydeder) tekrarCevapKaydet(kayit);
  }
  // Kayıt asenkron: kullanıcı sonucu beklemeden ilerleyebilir. Hata olursa kayıt o
  // sorunun kaydında durur, geri dönünce "Tekrar Dene" ile yeniden gönderilebilir.
  function tekrarCevapKaydet(kayit) {
    if (!kayit || kayit.secilen === null || kayit.kayit === "bekliyor" || kayit.kayit === "tamam") return;
    var q = hatirlaticiSoruBul(kayit.guid);
    if (!q || !q.siklar[kayit.secilen]) return;
    kayit.kayit = "bekliyor";
    kayit.kayitHatasi = "";
    render();
    remoteFetch("/api/exam", "POST", {
      action: "wrong-question-answer", questionGuid: kayit.guid, selectedAnswer: q.siklar[kayit.secilen]
    }).then(function (r) {
      if (!r.ok) {
        kayit.kayit = "hata";
        kayit.kayitHatasi = (r.data && r.data.error) || "Cevap kaydedilemedi.";
        render(); return;
      }
      kayit.kayit = "tamam";
      if (r.data && r.data.guids) remoteWrongGuids = r.data.guids;
      render();
    }).catch(function () {
      kayit.kayit = "hata";
      kayit.kayitHatasi = "Bağlantı hatası — cevap kaydedilemedi.";
      render();
    });
  }
  function retryTekrarKayit() {
    var kayit = tekrarAktifKayit();
    if (kayit && kayit.kayit === "hata") tekrarCevapKaydet(kayit);
  }
  function nextTekrarSoru() {
    if (!currentTekrar || currentTekrar.konum >= currentTekrar.kuyruk.length - 1) return;
    currentTekrar.konum++;
    render();
  }
  function prevTekrarSoru() {
    if (!currentTekrar || currentTekrar.konum <= 0) return;
    currentTekrar.konum--;
    render();
  }
  function finishTekrarTest() {
    if (!currentTekrar) { VIEW = "menuDeneme"; render(); return; }
    var oturum = [];
    currentTekrar.kayitlar.forEach(function (k) {
      if (k.secilen === null) return;
      var q = hatirlaticiSoruBul(k.guid);
      if (q) oturum.push({ konu: q.konu, dogru: !!k.dogru });
    });
    lastTekrarSonuc = { tur: currentTekrar.tur, oturum: oturum, soruSayisi: currentTekrar.kuyruk.length };
    currentTekrar = null;
    VIEW = "tekrarSonuc";
    render();
  }
  function tekrarCik() {
    currentTekrar = null;
    lastTekrarSonuc = null;
    VIEW = "menuDeneme";
    render();
  }

  // Gerçek .docx üretimi — "docx" kütüphanesi (OOXML) yalnız butona basılınca CDN'den
  // yüklenir (1MB+, ana sayfa yükünü büyütmesin diye eager değil). Word/Google Docs/
  // LibreOffice'in hepsi native açar; eski "Word'e uyumlu HTML/.doc" hilesine gerek yok.
  var docxLibYuklendi = false;
  function docxKutuphaneYukle(basarili, hata) {
    if (window.docx) { docxLibYuklendi = true; basarili(); return; }
    if (docxLibYuklendi) { basarili(); return; }
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js";
    s.onload = function () { docxLibYuklendi = true; basarili(); };
    s.onerror = hata;
    document.head.appendChild(s);
  }

  // Sorular önce, cevap+açıklamalar sonda ayrı bir bölümde — kullanıcı isteği:
  // "Cevap ve açıklamalar sorulardan sonra olacak şekilde."
  function hatirlaticiDocxOlustur(guids) {
    var d = window.docx;
    var harfler = ["A", "B", "C", "D"];
    var children = [new d.Paragraph({ text: "Hatırlatıcılarım — Sorular", heading: d.HeadingLevel.HEADING_1 })];
    guids.forEach(function (g, i) {
      var q = hatirlaticiSoruBul(g);
      children.push(new d.Paragraph({
        spacing: { before: 240 },
        children: [new d.TextRun({ text: (i + 1) + ". " + q.konu, bold: true })]
      }));
      children.push(new d.Paragraph({ text: q.soru, spacing: { after: 80 } }));
      q.siklar.forEach(function (s, idx) {
        if (s) children.push(new d.Paragraph({ text: harfler[idx] + ") " + s }));
      });
    });
    children.push(new d.Paragraph({ text: "Cevaplar ve Açıklamalar", heading: d.HeadingLevel.HEADING_1, pageBreakBefore: true }));
    guids.forEach(function (g, i) {
      var q = hatirlaticiSoruBul(g);
      var dogruHarf = harfler[q.cevapIdx] || "";
      var dogruMetin = q.cevapMetni || q.siklar[q.cevapIdx] || "";
      children.push(new d.Paragraph({
        spacing: { before: 240 },
        children: [new d.TextRun({ text: (i + 1) + ". " + dogruHarf + ") " + dogruMetin, bold: true })]
      }));
      if (q.aciklama) children.push(new d.Paragraph({ text: q.aciklama, spacing: { after: 80 } }));
    });
    return new d.Document({ sections: [{ children: children }] });
  }

  function exportHatirlaticiWord() {
    var guids = (remoteReminderGuids || []).filter(function (g) { return hatirlaticiSoruBul(g); });
    if (!guids.length) { showBanner("İşaretli soru bulunamadı.", true); return; }
    showBanner("Word belgesi hazırlanıyor…");
    docxKutuphaneYukle(function () {
      window.docx.Packer.toBlob(hatirlaticiDocxOlustur(guids)).then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "hatirlaticilarim.docx";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }).catch(function () { showBanner("Word belgesi oluşturulamadı.", true); });
    }, function () { showBanner("Word kütüphanesi yüklenemedi — internet bağlantısını kontrol et.", true); });
  }

  function finishExam() {
    if (currentExam && currentExam.uzak) { finishExamRemote(); return; }
    var res = scoreExam(STATE.bank, currentExam.sorular, currentExam.cevaplar, currentExam.soruKayitlari);
    var now = new Date().toISOString();
    STATE.pausedExam = null;
    var bankByGuid = {};
    STATE.bank.forEach(function (q) { bankByGuid[q.guid] = q; });
    currentExam.sorular.forEach(function (guid) {
      if (!STATE.stats[guid]) STATE.stats[guid] = { gosterim: 0, dogru: 0, yanlis: 0, sonSonucDogruMu: null, sonGorulme: null };
      var s = STATE.stats[guid];
      s.gosterim++;
      s.sonGorulme = now;
      var secilen = currentExam.cevaplar[guid];
      var q = oturumSorusu(currentExam, STATE.bank, guid);
      if (secilen === undefined || secilen === null) { s.sonSonucDogruMu = null; }
      else if (q && secilen === q.cevapIdx) { s.dogru++; s.sonSonucDogruMu = true; }
      else { s.yanlis++; s.sonSonucDogruMu = false; }
    });
    var entry = {
      id: "h" + Date.now(), tarihISO: now, tip: currentExam.tip, seed: currentExam.seed,
      sorular: currentExam.sorular, cevaplar: currentExam.cevaplar,
      soruKayitlari: currentExam.soruKayitlari,
      skor: res.skor, konuKirilim: res.konuKirilim, sureSaniye: currentExam.gecenSaniye || 0
    };
    STATE.history.unshift(entry);
    if (STATE.history.length > 100) STATE.history = STATE.history.slice(0, 100);
    lastResult = entry;
    VIEW = "result";
    currentExam = null;
    pendingSaveDirty = false; // bu save zaten güncel STATE'in tamamını kaydediyor
    render();
    saveAndPublish(); // saveAndPublish artık VIEW/lastResult'ı kendi stashPendingView()'ıyla saklıyor
  }

  // Rastgele Soru iki havuzdan da çalışır: "bank" (Deneme sayfası, sınav bankası) ve
  // "practice" (Test sayfası, konu çalışma havuzu). Mantık birebir aynı; yalnız hangi
  // dizinin örneklendiği ve istatistiğin hangi sözlüğe (stats / pStats) yazıldığı değişir.
  function flashHavuzu(kaynak, konuFiltre) {
    var havuz = kaynak === "practice" ? STATE.practiceBank.filter(function (q) { return !pratikKapsamDisiMi(q); }) : STATE.bank;
    if (konuFiltre) havuz = havuz.filter(function (q) { return q.konu === konuFiltre; });
    return havuz;
  }
  function flashSoruBul(f) {
    return flashHavuzu(f.kaynak, f.konuFiltre).filter(function (b) { return b.guid === f.guid; })[0];
  }

  // Rastgele Soru artık kör rastgele değil ama kesin gruplama da değil: her seçimde
  // ağırlıklı rastgele (bkz. soruAgirligi) — yanlış geçmişliler daha sık, ama
  // denenmemiş/doğru da her zaman bir ihtimalle gelebilir (kesin gruplama "her
  // session'da hep aynı yanlış havuzuyla başlıyorum" şikayetine yol açmıştı,
  // kullanıcı geri bildirimi 8 Eyl 2026). kaynak "practice" ise pStats, "bank"
  // ise stats sözlüğü okunur.
  // `haric`: bu OTURUMDA zaten gösterilmiş guid'ler — havuz onları çıkarınca
  // tükeniyorsa (ör. konu çok küçük) tekrara izin verilir, aksi halde aynı soru
  // art arda / aynı oturumda tekrar tekrar çıkmasın diye elenir.
  function flashSecimYap(havuz, kaynak, haric) {
    var statlar = kaynak === "practice" ? STATE.pStats : STATE.stats;
    var haricSet = {};
    (haric || []).forEach(function (g) { haricSet[g] = true; });
    var tazeHavuz = havuz.filter(function (q) { return !haricSet[q.guid]; });
    var aktifHavuz = tazeHavuz.length ? tazeHavuz : havuz;
    // Havuz bu oturumda tamamen tükendiyse (tazeHavuz boş) tekrara izin verilir, AMA
    // az önce gösterilen TEK soru (haric'in son elemanı) yine de mümkünse hemen bir
    // sonraki soru olarak önerilmez — "doğru işaretlediğim soru hemen tekrar karşıma
    // çıkıyor" şikayeti buradan kaynaklanıyordu (7 Eyl 2026).
    if (!tazeHavuz.length && haric && haric.length && havuz.length > 1) {
      var sonGosterilen = haric[haric.length - 1];
      var sonHaricYok = aktifHavuz.filter(function (q) { return q.guid !== sonGosterilen; });
      if (sonHaricYok.length) aktifHavuz = sonHaricYok;
    }
    return weightedOrder(aktifHavuz, function (q) { return soruAgirligi(q.guid, statlar); })[0];
  }

  // Havuzun tamamından (konuFiltre yokken) çekerken hangi konudan geleceğini resmi
  // sınav dağılımına (STATE.settings.dagilim) göre ağırlıklandırır — böylece Rastgele
  // Soru, gerçek sınavın konu oranlarını taklit eden ufak bir simülasyon gibi çalışır.
  // konuFiltre zaten TEK bir konuya daraltıyorsa (Konu Konu Bak) buna gerek yok, o
  // zaman null döner ve çağıran taraf havuzu olduğu gibi kullanır.
  function agirlikliHavuzSec(havuz) {
    var dagilim = (STATE.settings && STATE.settings.dagilim) || {};
    var mevcut = {};
    havuz.forEach(function (q) { mevcut[q.konu] = true; });
    var adaylar = Object.keys(dagilim).filter(function (k) { return dagilim[k] > 0 && mevcut[k]; });
    if (!adaylar.length) return null;
    var toplam = adaylar.reduce(function (s, k) { return s + dagilim[k]; }, 0);
    var r = Math.random() * toplam;
    var secilenKonu = adaylar[adaylar.length - 1];
    for (var i = 0; i < adaylar.length; i++) {
      r -= dagilim[adaylar[i]];
      if (r <= 0) { secilenKonu = adaylar[i]; break; }
    }
    return havuz.filter(function (q) { return q.konu === secilenKonu; });
  }

  function startFlash(kaynak, konuFiltre) {
    if (STATE.sadeceDeneme && !remoteGirisTamamMi()) return;
    kaynak = kaynak === "practice" ? "practice" : "bank";
    konuFiltre = konuFiltre || null;
    var havuz = flashHavuzu(kaynak, konuFiltre);
    if (havuz.length === 0) { showBanner("Havuzda hiç soru yok.", true); return; }
    flashSayac = 0;
    var secimHavuzu = konuFiltre ? havuz : (agirlikliHavuzSec(havuz) || havuz);
    var q0 = flashSecimYap(secimHavuzu, kaynak, []);
    shuffleSiklarInPlace(q0);
    // oturum: bu Rastgele Soru oturumunda cevaplanan her sorunun {konu, dogruMu} kaydı —
    // "Testi Bitir" ekranındaki ders bazlı dağılım buradan hesaplanır, kalıcı istatistikten değil.
    // gecmis/konum: bu oturumda gösterilen her sorunun {guid,secilen} kaydı ve şu an
    // hangisinin ekranda olduğu — "Önceki/Sonraki Soru" ile geçmişte gezinmeyi sağlar.
    currentFlash = {
      guid: q0.guid, secilen: null, kaynak: kaynak, konuFiltre: konuFiltre, oturum: [],
      gecmis: [{ guid: q0.guid, secilen: null }], konum: 0
    };
    VIEW = "flash";
    render();
  }
  function nextFlash() {
    if (!currentFlash) { backToMenu(); return; }
    if (currentFlash.konum < currentFlash.gecmis.length - 1) {
      // Daha önce "Önceki Soru" ile geri gidilmiş — yeni soru üretmeden ileri sar.
      currentFlash.konum++;
    } else {
      var havuz = flashHavuzu(currentFlash.kaynak, currentFlash.konuFiltre);
      if (havuz.length === 0) { backToMenu(); return; }
      flashSayac++;
      var secimHavuzu = currentFlash.konuFiltre ? havuz : (agirlikliHavuzSec(havuz) || havuz);
      var gorulmus = currentFlash.gecmis.map(function (x) { return x.guid; });
      var q1 = flashSecimYap(secimHavuzu, currentFlash.kaynak, gorulmus);
      shuffleSiklarInPlace(q1);
      currentFlash.gecmis.push({ guid: q1.guid, secilen: null });
      currentFlash.konum = currentFlash.gecmis.length - 1;
    }
    var guncel = currentFlash.gecmis[currentFlash.konum];
    currentFlash.guid = guncel.guid; currentFlash.secilen = guncel.secilen;
    render();
  }
  function prevFlash() {
    if (!currentFlash || currentFlash.konum <= 0) return;
    currentFlash.konum--;
    var guncel = currentFlash.gecmis[currentFlash.konum];
    currentFlash.guid = guncel.guid; currentFlash.secilen = guncel.secilen;
    render();
  }
  function selectFlashOption(idx) {
    if (!currentFlash || currentFlash.secilen !== null) return; // cevap zaten verildi, kilitli
    currentFlash.secilen = idx;
    currentFlash.gecmis[currentFlash.konum].secilen = idx; // geri/ileri giderken cevap kaybolmasın
    var q = flashSoruBul(currentFlash);
    if (!q) { render(); return; }
    var flashDogruMu = idx === q.cevapIdx;
    currentFlash.oturum.push({ konu: q.konu, dogru: flashDogruMu });
    if (currentFlash.kaynak === "practice") {
      recordPratikStat(q.guid, flashDogruMu); // pStats'e yazar + veriDegisti()
      STATE.pFlashOzet.gosterim++;
      if (flashDogruMu) STATE.pFlashOzet.dogru++;
      lsKaydet();
    } else {
      if (!STATE.stats[q.guid]) STATE.stats[q.guid] = { gosterim: 0, dogru: 0, yanlis: 0, sonSonucDogruMu: null, sonGorulme: null };
      var s = STATE.stats[q.guid];
      s.gosterim++;
      s.sonGorulme = new Date().toISOString();
      if (flashDogruMu) { s.dogru++; s.sonSonucDogruMu = true; } else { s.yanlis++; s.sonSonucDogruMu = false; }
      STATE.flashOzet.gosterim++;
      if (flashDogruMu) STATE.flashOzet.dogru++;
      veriDegisti();
    }
    render();
  }

  function finishFlash() {
    if (!currentFlash) { backToMenu(); return; }
    lastFlashResult = { kaynak: currentFlash.kaynak, konuFiltre: currentFlash.konuFiltre, oturum: currentFlash.oturum };
    currentFlash = null;
    VIEW = "flashResult";
    render();
    // Testi Bitir gerçek bir çıkış noktası — bu oturumdaki stats/pStats hemen yayınlansın,
    // 3 dk'lık autosave'i veya sonraki "ana sayfaya dön" tıklamasını beklemesin.
    if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
    pendingSaveDirty = false;
    saveAndPublish();
  }

  function backToMenu() {
    if (currentPratik && !currentPratik.bitti) { pratikSlotYaz(); bumpRev(); lsKaydet(); pendingSaveDirty = true; }
    VIEW = STATE.sadeceDeneme ? "menuDeneme" : "menu"; currentExam = null; lastResult = null; currentFlash = null; lastFlashResult = null;
    currentPratik = null; pratikSeciliKonu = null; pratikSeciliModul = null;
    checkpointSeciliKonu = null; checkpointSeciliId = null;
    pausedDeleteConfirm = false; deletingHistoryId = null; denemeKodOnizleme = null;
    render();
    if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
    if (pendingSaveDirty) { pendingSaveDirty = false; saveAndPublish(); }
  }
