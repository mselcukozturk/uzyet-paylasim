  // Rastgele Soru ekranının düzeni birebir korunur: çıkış aksiyonları üstte
  // sol/sağ ayrık (sol: sayfadan çık, sağ: testi bitir), devam aksiyonları
  // (Önceki/Sonraki Soru) sticky alt barda ayrı bir grup olarak.
  function renderTekrarTest() {
    if (!currentTekrar) return '<div class="card">Oturum bulunamadı. <button class="btn" data-action="tekrar-cik">Ana Sayfa</button></div>';
    var cfg = TEKRAR_TUR[currentTekrar.tur];
    var kayit = tekrarAktifKayit();
    var q = kayit && hatirlaticiSoruBul(kayit.guid);
    var cevaplanan = currentTekrar.kayitlar.filter(function (k) { return k.secilen !== null; }).length;
    var sonSoruda = currentTekrar.konum >= currentTekrar.kuyruk.length - 1;
    var cikisRow = '<div class="link-row" style="justify-content:space-between;margin-bottom:10px">' +
      '<button class="btn ghost" data-action="tekrar-cik">← Çık</button>' +
      (cevaplanan ? '<button class="btn" data-action="finish-tekrar-test">✅ Testi Bitir (' + cevaplanan + ")</button>" : "") +
      "</div>";
    var navHtml = '<div class="sticky-next-bar link-row">' +
      '<button class="btn ghost" data-action="prev-tekrar-soru"' + (currentTekrar.konum <= 0 ? " disabled" : "") + ">← Önceki Soru</button>" +
      '<button class="btn' + (kayit && kayit.secilen !== null ? " primary" : "") + '" data-action="next-tekrar-soru"' +
      (sonSoruda ? " disabled" : "") + ">Sonraki Soru →</button>" +
      "</div>";
    if (!q) {
      return cikisRow + '<div class="card"><div class="muted">Bu soru artık bankada yok.</div>' + navHtml + "</div>";
    }
    var harfler = ["A", "B", "C", "D"];
    var secilen = kayit.secilen;
    var answered = secilen !== null;
    var optionsHtml = q.siklar.map(function (s, i) {
      if (!s) return "";
      var cls = "option-row";
      if (answered) {
        if (i === q.cevapIdx) cls += " correct";
        else if (i === secilen) cls += " wrong";
      }
      var action = answered ? "" : ' data-action="select-tekrar-option" data-idx="' + i + '"';
      return '<div class="' + cls + '"' + action + '><span class="option-letter">' + harfler[i] +
        '</span><span class="option-text">' + escapeHtml(s) + "</span>" +
        (answered ? "" : '<span class="kbd-hint">' + (i + 1) + "</span>") + "</div>";
    }).join("");
    var sonucHtml = "";
    if (answered) {
      var dogruMu = secilen === q.cevapIdx;
      var pillMetin = cfg.kaydeder
        ? (dogruMu ? "Doğru — kaydedilince havuzdan çıkacak." : "Yanlış — doğrusu " + harfler[q.cevapIdx] + ". Soru havuzda kalacak.")
        : (dogruMu ? "Doğru!" : "Yanlış — doğrusu " + harfler[q.cevapIdx]);
      sonucHtml = '<div class="pill ' + (dogruMu ? "good" : "bad") + '" style="margin:10px 0">' + pillMetin + "</div>" +
        (q.aciklama ? '<div class="review-expl">' + escapeHtml(q.aciklama) + "</div>" : "") +
        (kayit.kayit === "bekliyor" ? '<div class="muted" style="margin-top:8px">Cevap kaydediliyor…</div>' : "") +
        (kayit.kayit === "hata" ? '<div class="banner error" style="margin-top:8px">' + escapeHtml(kayit.kayitHatasi) +
          ' <button class="btn ghost" data-action="retry-tekrar-kayit">Tekrar Dene</button></div>' : "");
    }
    return cikisRow +
      '<div class="card">' +
      '<div class="q-meta"><span>' + cfg.etiket + " · " + (currentTekrar.konum + 1) + " / " + currentTekrar.kuyruk.length +
      ". soru</span><span>" + konuDotHtml(q.konu) + escapeHtml(q.konu) + "</span></div>" +
      '<div class="q-text">' + escapeHtml(q.soru) + "</div>" +
      optionsHtml + sonucHtml + navHtml +
      "</div>";
  }

  // Oturum özeti Rastgele Soru'nunkiyle aynı: skor + ders kırılımı tablosu.
  function renderTekrarSonuc() {
    if (!lastTekrarSonuc) { VIEW = "menuDeneme"; return renderMenuDeneme(); }
    var cfg = TEKRAR_TUR[lastTekrarSonuc.tur];
    var oturum = lastTekrarSonuc.oturum;
    var toplam = oturum.length;
    var dogru = oturum.filter(function (k) { return k.dogru; }).length;
    var yanlis = toplam - dogru;
    var kirilim = flashSonucKirilimi(oturum);
    var konular = Object.keys(kirilim).sort(function (a, b) {
      return KONU_SIRA.indexOf(a) - KONU_SIRA.indexOf(b);
    });
    var topicRows = konular.map(function (konu) {
      var k = kirilim[konu];
      var kToplam = k.dogru + k.yanlis;
      return "<tr><td>" + basariNoktaHtml(k.dogru, kToplam) + escapeHtml(konu) + '</td><td class="num">' + kToplam +
        '</td><td class="num">' + flashYuzdeHtml(k.dogru, kToplam) +
        '</td><td class="num">' + flashYuzdeHtml(k.yanlis, kToplam) + "</td></tr>";
    }).join("");
    var kalan = cfg.guidler().filter(function (g) { return hatirlaticiSoruBul(g); }).length;
    var kalanEtiket = lastTekrarSonuc.tur === "yanlis"
      ? "Havuzda " + kalan + " yanlış soru kaldı."
      : "İşaretli " + kalan + " soru var.";
    return '<div class="card">' +
      '<div class="section-title">' + cfg.etiket + " — oturum özeti</div>" +
      '<div class="score-hero"><span class="big">' + dogru + " / " + toplam + "</span>" +
      '<span class="pill good">' + flashYuzdeHtml(dogru, toplam) + " doğru</span>" +
      '<span class="pill bad">' + flashYuzdeHtml(yanlis, toplam) + " yanlış</span></div>" +
      (toplam
        ? '<table class="topic-table"><thead><tr><th>Ders</th><th class="num">Soru</th><th class="num">Doğru</th><th class="num">Yanlış</th></tr></thead><tbody>' +
          topicRows + "</tbody></table>"
        : '<div class="muted">Hiç soru cevaplanmadan bitirildi.</div>') +
      '<div class="muted" style="margin-top:10px">' + lastTekrarSonuc.soruSayisi + " soruluk oturum · " + kalanEtiket + "</div>" +
      '<div class="link-row" style="margin-top:14px">' +
      (kalan ? '<button class="btn primary" data-action="start-tekrar-again" data-tur="' + lastTekrarSonuc.tur + '">' + cfg.yeniOturum + "</button>" : "") +
      '<button class="btn ghost" data-action="tekrar-cik">Ana Sayfa</button>' +
      "</div></div>";
  }

  function renderDenemeKonuSec() {
    var tiles = KONU_SIRA.map(function (konu) {
      var havuz = STATE.bank.filter(function (q) { return q.konu === konu; });
      var yanlis = havuz.filter(function (q) { return STATE.stats[q.guid] && STATE.stats[q.guid].sonSonucDogruMu === false; }).length;
      var aktif = havuz.length > 0;
      var renk = "var(--seri-" + konuSeriIdx(konu) + ")";
      return '<button class="mode-btn" style="border-left:4px solid ' + renk + '" ' + (aktif ? "" : "disabled") +
        ' data-action="start-deneme-konu-flash" data-konu="' + escapeHtml(konu) + '">' +
        '<div class="title">' + konuDotHtml(konu) + escapeHtml(konu) + "</div>" +
        '<div class="desc">' + (aktif ? havuz.length + " soru" + (yanlis ? " · " + yanlis + " yanlış geçmişli" : "") : "Havuzda soru yok") + "</div></button>";
    }).join("");

    return '<div class="link-row"><button class="btn ghost" data-action="open-menu-deneme">← Deneme Sınavı</button></div>' +
      '<div class="section-title">📖 Konu Konu Bak</div>' +
      '<div class="desc" style="margin-bottom:12px">Sınav dışında, seçtiğin konudaki sorulara tek tek bakıp anında cevap görürsün. Cevapların Rastgele Soru gibi sınav istatistiğine (doğruluk, az görülen/yanlış önceliği) yazılır — ayrı bir sınav denemesi veya geçmiş kaydı oluşmaz.</div>' +
      '<div class="mode-grid">' + tiles + "</div>";
  }

  function renderMenuTest() {
    var pratikHavuzToplam = STATE.practiceBank.length;
    var pDogru = Object.keys(STATE.pStats).filter(function (g) { return STATE.pStats[g].sonSonucDogruMu === true; }).length;
    var pYanlis = Object.keys(STATE.pStats).filter(function (g) { return STATE.pStats[g].sonSonucDogruMu === false; }).length;
    var pFlashYuzde = STATE.pFlashOzet.gosterim ? Math.round((STATE.pFlashOzet.dogru / STATE.pFlashOzet.gosterim) * 100) : null;

    var statCards = [
      { num: pratikHavuzToplam, lbl: "Pratik havuzu" },
      { num: pDogru, lbl: "Doğru çözülen soru" },
      { num: pYanlis, lbl: "Yanlış geçmişli soru" },
      { num: pFlashYuzde === null ? "—" : pFlashYuzde + "%", lbl: "Rastgele Soru Doğruluğu", renk: renkEsigi(pFlashYuzde) }
    ].map(function (c) {
      var stil = c.renk ? ' style="color:' + c.renk + '"' : "";
      return '<div class="stat-card"><div class="num"' + stil + '>' + escapeHtml(c.num) + '</div><div class="lbl">' + c.lbl + "</div></div>";
    }).join("");

    // Yarım kalan konu çalışmaları — en son kaydedilen üstte.
    var slotKeys = Object.keys(STATE.pausedPratik).sort(function (a, b) {
      return (STATE.pausedPratik[b].savedAtISO || "").localeCompare(STATE.pausedPratik[a].savedAtISO || "");
    });
    var yarimKalanHtml = "";
    if (slotKeys.length) {
      yarimKalanHtml = '<div class="section-title">▶ Yarım kalan çalışmalar</div><div class="mode-grid">' +
        slotKeys.map(function (key) {
          var s = STATE.pausedPratik[key];
          var parts = key.split("::"), konu = parts[0], modul = parts[1];
          var cevaplanan = Object.keys(s.cevaplar || {}).length;
          var toplam = s.kuyruk.length;
          var yuzde = Math.round((cevaplanan / toplam) * 100);
          return '<div class="card resume-card" style="border-left:4px solid var(--seri-' + konuSeriIdx(konu) + ')">' +
            '<div class="title">' + konuDotHtml(konu) + escapeHtml(konu) + " · " + escapeHtml(modulAdi(konu, modul)) + "</div>" +
            '<div class="desc">' + cevaplanan + " / " + toplam + " soru cevaplanmış (%" + yuzde + ") · " + fmtTarih(s.savedAtISO) + "</div>" +
            '<div class="link-row" style="margin-top:10px">' +
            '<button class="btn primary" data-action="devam-pratik" data-konu="' + escapeHtml(konu) + '" data-modul="' + escapeHtml(modul) + '">Devam Et</button>' +
            '<button class="btn ghost" data-action="pratik-slot-at" data-konu="' + escapeHtml(konu) + '" data-modul="' + escapeHtml(modul) + '">Sil</button>' +
            "</div></div>";
        }).join("") + "</div>";
    }

    var flashDisabled = pratikHavuzToplam === 0 ? "disabled" : "";
    var flashCard = '<div class="mode-grid"><button class="mode-btn" style="border-left:4px solid var(--seri-7)" ' + flashDisabled +
      ' data-action="start-pratik-flash">' +
      '<div class="title">🎲 Rastgele Soru</div><div class="desc">Pratik havuzunun tamamından tek soru, anında cevap — konu/modül seçmeden hızlı pratik.</div></button></div>';

    // Konu (ders) kutuları doğrudan bu ekranda — ayrı bir "Konu Çalışma" giriş ekranı/tıklaması yok.
    var tiles = KONU_SIRA.map(function (konu) {
      var modlar = MODUL_TANIMLARI[konu];
      var soruSayisi = modlar ? STATE.practiceBank.filter(function (q) { return q.konu === konu; }).length : 0;
      var aktif = modlar && soruSayisi > 0;
      var renk = "var(--seri-" + konuSeriIdx(konu) + ")";
      return '<button class="mode-btn" style="border-left:4px solid ' + renk + '" ' + (aktif ? "" : "disabled") +
        ' data-action="select-pratik-konu" data-konu="' + escapeHtml(konu) + '">' +
        '<div class="title">' + konuDotHtml(konu) + escapeHtml(konu) + "</div>" +
        '<div class="desc">' + (aktif ? soruSayisi + " soru · " + modlar.length + " modül" : "Henüz hazır değil") + "</div></button>";
    }).join("");

    return '<div class="link-row"><button class="btn ghost" data-action="back-menu">← Ana Menü</button></div>' +
      '<div class="section-title">📚 Test</div>' +
      '<div class="stat-grid">' + statCards + "</div>" +
      yarimKalanHtml +
      flashCard +
      '<div class="section-title">Hangi dersle çalışmak istersin?</div>' +
      '<div class="mode-grid">' + tiles + "</div>";
  }

  // ------------------------------------------------------------ Checkpoint --
  // Bölüm özetleri (numaralı checkpoint listeleri) — sınav bankasından ve
  // pratik havuzundan tamamen ayrı, salt-okunur bir referans alanı.
  // İstatistik tutulmaz. Kaynağı checkpoints.json (bkz. build_quiz_dist.py).
  function checkpointKonular() {
    var konular = [];
    STATE.checkpoints.forEach(function (c) {
      if (konular.indexOf(c.konu) === -1) konular.push(c.konu);
    });
    konular.sort(function (a, b) {
      var ia = KONU_SIRA.indexOf(a), ib = KONU_SIRA.indexOf(b);
      if (ia === -1) ia = 999; if (ib === -1) ib = 999;
      return ia - ib || a.localeCompare(b, "tr");
    });
    return konular;
  }

  function renderCheckpointListe() {
    if (STATE.checkpoints.length === 0) {
      return '<div class="link-row"><button class="btn ghost" data-action="back-menu">← Ana Menü</button></div>' +
        '<div class="section-title">📌 Checkpoint</div>' +
        '<div class="banner">Henüz checkpoint özeti eklenmemiş.</div>';
    }
    if (!checkpointSeciliKonu) {
      var konular = checkpointKonular();
      var tiles = konular.map(function (konu) {
        var liste = STATE.checkpoints.filter(function (c) { return c.konu === konu; });
        var toplamMadde = liste.reduce(function (s, c) {
          var m = (c.subtitle || "").match(/(\d+)\s*checkpoint/i);
          return s + (m ? parseInt(m[1], 10) : 0);
        }, 0);
        var renk = "var(--seri-" + konuSeriIdx(konu) + ")";
        return '<button class="mode-btn" style="border-left:4px solid ' + renk + '" data-action="select-checkpoint-konu" data-konu="' + escapeHtml(konu) + '">' +
          '<div class="title">' + konuDotHtml(konu) + escapeHtml(konu) + "</div>" +
          '<div class="desc">' + liste.length + " bölüm özeti" + (toplamMadde ? " · ~" + toplamMadde + " checkpoint" : "") + "</div></button>";
      }).join("");
      return '<div class="link-row"><button class="btn ghost" data-action="back-menu">← Ana Menü</button></div>' +
        '<div class="section-title">📌 Checkpoint</div>' +
        '<div class="muted" style="margin-bottom:16px">Bölümün tamamını numaralı checkpoint\'ler hâlinde tarayan özetler. Hangi dersle çalışmak istersin?</div>' +
        '<div class="mode-grid">' + tiles + "</div>";
    }
    var konu = checkpointSeciliKonu;
    var items = STATE.checkpoints.filter(function (c) { return c.konu === konu; });
    var rows = items.map(function (c) {
      return '<button class="cp-list-item" data-action="open-checkpoint-detay" data-id="' + escapeHtml(c.id) + '">' +
        '<div class="title">' + escapeHtml(c.title) + '</div><div class="desc">' + escapeHtml(c.subtitle) + "</div></button>";
    }).join("");
    return '<div class="link-row"><button class="btn ghost" data-action="open-checkpoint-liste">← Konular</button></div>' +
      '<div class="section-title">' + konuDotHtml(konu) + escapeHtml(konu) + "</div>" +
      rows;
  }

  function renderCheckpointDetay() {
    var c = STATE.checkpoints.filter(function (x) { return x.id === checkpointSeciliId; })[0];
    if (!c) { checkpointSeciliId = null; return renderCheckpointListe(); }
    var items = STATE.checkpoints.filter(function (x) { return x.konu === c.konu; });
    var idx = items.indexOf(c);
    var prevBtn = items[idx - 1]
      ? '<button class="btn" data-action="open-checkpoint-detay" data-id="' + escapeHtml(items[idx - 1].id) + '">← Önceki</button>' : "";
    var nextBtn = items[idx + 1]
      ? '<button class="btn" data-action="open-checkpoint-detay" data-id="' + escapeHtml(items[idx + 1].id) + '">Sonraki →</button>' : "";
    return '<div class="link-row"><button class="btn ghost" data-action="checkpoint-konu-geri">← ' + escapeHtml(c.konu) + " Özetleri</button></div>" +
      '<div class="card">' +
      '<div class="section-title" style="margin-bottom:2px">' + escapeHtml(c.title) + "</div>" +
      '<div class="muted" style="margin-bottom:18px">' + escapeHtml(c.subtitle) + "</div>" +
      '<div class="cp-content">' + c.html + "</div>" +
      '<div class="link-row" style="margin-top:20px">' + prevBtn + nextBtn + "</div>" +
      "</div>";
  }

  // Soruyu (soru + şıklar + varsa kaynak) düz metin olarak panoya kopyalar —
  // WhatsApp/not uygulamasına yapıştırmak için. Bilerek doğru cevap/açıklama
  // içermez — amaç soruyu birine sorabilmek, cevabı ifşa etmemek.
  function kopyalaSoruMetni(q) {
    var harfler = ["A", "B", "C", "D"];
    var satirlar = [q.soru, ""];
    q.siklar.forEach(function (s, i) { if (s) satirlar.push(harfler[i] + ") " + s); });
    if (q.kaynak) { satirlar.push(""); satirlar.push("Kaynak: " + q.kaynak); }
    return satirlar.join("\n");
  }

  function kopyalaPano(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { showBanner("Soru panoya kopyalandı."); })
        .catch(function () { showBanner("Kopyalama başarısız — tarayıcı izin vermedi.", true); });
    } else {
      showBanner("Bu tarayıcıda panoya kopyalama desteklenmiyor.", true);
    }
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // Sınav sonucu ekranındaki skor kartını (soru listesi/butonlar hariç) tek bir PNG
  // görsele çevirip panoya kopyalar — WhatsApp vb.'de kolay paylaşım için. Deneme
  // kodu görselin İÇİNE, en alta yazılır (ayrı bir metin kopyası panoyu ezip
  // görselin üstüne geçmesin diye) — kullanıcı isteği, 8 Eyl 2026.
  function sonucGorseliKopyala() {
    var r = lastResult;
    if (!r) return;
    if (!window.html2canvas) { showBanner("Görsel oluşturma kütüphanesi yüklenemedi — internet bağlantısını kontrol et.", true); return; }
    var toplam = r.skor.dogru + r.skor.yanlis + r.skor.bos;
    var yuzde = toplam ? Math.round((r.skor.dogru / toplam) * 100) : null;
    var kod = r.examCode || examKoduUret(r.tip, r.seed);

    var bg = cssVar("--surface"), border = cssVar("--border"), text = cssVar("--text"),
      muted = cssVar("--text-muted"), good = cssVar("--good"), goodBg = cssVar("--good-bg"),
      bad = cssVar("--bad"), badBg = cssVar("--bad-bg"), warn = cssVar("--warn"), warnBg = cssVar("--warn-bg"),
      accent = cssVar("--accent"), fontDisplay = cssVar("--font-display"), fontBody = cssVar("--font-body");
    var yuzdeRenk = yuzde === null ? muted : renkEsigi(yuzde);
    var hucreKenar = "padding:6px 8px;border-bottom:1px solid " + border;
    var td = 'style="' + hucreKenar + '"';
    var tdNum = 'style="' + hucreKenar + ';text-align:right;font-variant-numeric:tabular-nums"';
    var thBaslik = function (align) { return 'style="text-align:' + align + ";" + hucreKenar + ";color:" + muted + ';font-size:0.7rem;text-transform:uppercase"'; };

    var topicRows = Object.keys(r.konuKirilim).map(function (konu) {
      var k = r.konuKirilim[konu];
      return "<tr><td " + td + ">" + konuDotHtml(konu) + escapeHtml(konu) + "</td><td " + tdNum + ">" + k.dogru +
        "</td><td " + tdNum + ">" + k.yanlis + "</td><td " + tdNum + ">" + k.bos + "</td></tr>";
    }).join("");

    var node = document.createElement("div");
    node.style.cssText = "position:fixed;left:-99999px;top:0;width:480px;padding:24px;box-sizing:border-box;" +
      "background:" + bg + ";color:" + text + ";font-family:" + fontBody + ";border:1px solid " + border + ";border-radius:10px;";
    node.innerHTML =
      '<div style="font-family:' + fontDisplay + ';font-weight:700;font-size:0.9rem;color:' + accent + ';margin-bottom:12px">UZYET — Deneme Sonucu</div>' +
      '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px">' +
      '<span style="font-family:' + fontDisplay + ';font-size:2.1rem;font-weight:700">' + r.skor.dogru + " / " + toplam + "</span>" +
      '<span style="padding:3px 10px;border-radius:999px;font-size:0.8rem;font-weight:600;background:' + goodBg + ";color:" + good + '">' + r.skor.dogru + " doğru</span>" +
      '<span style="padding:3px 10px;border-radius:999px;font-size:0.8rem;font-weight:600;background:' + badBg + ";color:" + bad + '">' + r.skor.yanlis + " yanlış</span>" +
      '<span style="padding:3px 10px;border-radius:999px;font-size:0.8rem;font-weight:600;background:' + warnBg + ";color:" + warn + '">' + r.skor.bos + " boş</span>" +
      (yuzde === null ? "" : '<span style="padding:3px 10px;border-radius:999px;font-size:0.8rem;font-weight:600;color:' + yuzdeRenk + '">%' + yuzde + "</span>") +
      (typeof r.sureSaniye === "number" ? '<span style="color:' + muted + ';font-size:0.82rem">⏱ ' + fmtSure(r.sureSaniye) + " sürede bitti</span>" : "") +
      "</div>" +
      '<table style="width:100%;border-collapse:collapse;font-size:0.88rem"><thead><tr>' +
      "<th " + thBaslik("left") + ">Konu</th>" +
      "<th " + thBaslik("right") + ">Doğru</th>" +
      "<th " + thBaslik("right") + ">Yanlış</th>" +
      "<th " + thBaslik("right") + ">Boş</th>" +
      "</tr></thead><tbody>" + topicRows + "</tbody></table>" +
      (kod ? '<div style="margin-top:14px;padding-top:12px;border-top:1px solid ' + border + ";color:" + muted + ';font-size:0.8rem">Deneme kodu: <b style="font-family:' +
        fontDisplay + ';letter-spacing:0.03em;color:' + text + '">' + escapeHtml(kod) + "</b></div>" : "");

    document.body.appendChild(node);
    html2canvas(node, { backgroundColor: bg, scale: 2 }).then(function (canvas) {
      document.body.removeChild(node);
      canvas.toBlob(function (blob) {
        if (!blob) { showBanner("Görsel oluşturulamadı.", true); return; }
        if (navigator.clipboard && window.ClipboardItem) {
          navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
            .then(function () { showBanner("Sonuç görseli panoya kopyalandı."); })
            .catch(function () { showBanner("Kopyalama başarısız — tarayıcı izin vermedi.", true); });
        } else {
          showBanner("Bu tarayıcıda görsel kopyalama desteklenmiyor.", true);
        }
      });
    }).catch(function () {
      if (node.parentNode) document.body.removeChild(node);
      showBanner("Görsel oluşturulamadı.", true);
    });
  }

  function kopyalaAktifSoru(scope) {
    var q;
    if (scope === "exam" && currentExam) {
      var eguid = currentExam.sorular[currentExam.index];
      q = oturumSorusu(currentExam, STATE.bank, eguid);
    } else if (scope === "flash" && currentFlash) {
      q = flashSoruBul(currentFlash);
    } else if (scope === "pratik" && currentPratik && !currentPratik.bitti) {
      q = pratikSoruBul(currentPratik.kuyruk[currentPratik.index]);
    }
    if (!q) { showBanner("Kopyalanacak soru bulunamadı.", true); return; }
    kopyalaPano(kopyalaSoruMetni(q));
  }

  function kopyalaButonHtml(scope) {
    return '<div class="link-row" style="margin:-4px 0 8px">' +
      '<button class="btn ghost" style="padding:3px 10px;font-size:0.78rem" data-action="copy-soru" data-scope="' + scope + '">📋 Soruyu Kopyala</button>' +
      "</div>";
  }

  // Hatırlatıcı ve 🚩 hatalı bildirimi (kategori seçimiyle) her bağlamda aynı: Deneme
  // sınavı, sınav sonucu incelemesi, Rastgele Soru, Konu Konu Bak — hepsi aynı guid'i
  // paylaştığından (STATE.sadeceDeneme'de tek banka, sunucudan gelir) hepsi aynı şekilde
  // sunucuya senkronlanır (bkz. remoteFlagSync). showPratikExtras yalnız Test sayfasının
  // pratik havuzunda (kişisel Artifact, ayrı bir site) anlamlı.
  function flagBarHtml(guid, showPratikExtras) {
    var f = STATE.flags[guid] || bosFlagKaydi();
    var pratikExtraBtns = showPratikExtras
      ? '<button class="flag-btn' + (f.begenildi ? " active-star" : "") + '" data-action="toggle-flag" data-guid="' + guid + '" data-kind="begenildi">⭐ Beğendim — sınav bankasına aday</button>' +
        '<button class="flag-btn' + (f.kapsamDisi ? " active-outofscope" : "") + '" data-action="toggle-flag" data-guid="' + guid + '" data-kind="kapsamDisi">🗑️ Kapsam dışı</button>'
      : "";
    var html = '<div class="flag-bar">' +
      '<button class="flag-btn' + (f.hatirlatici ? " active-bookmark" : "") + '" data-action="toggle-flag" data-guid="' + guid + '" data-kind="hatirlatici">🔖 Hatırlatıcı</button>' +
      '<button class="flag-btn' + (f.hatali ? " active-report" : "") + '" data-action="toggle-flag" data-guid="' + guid + '" data-kind="hatali">🚩 Bu soru hatalı/eksik</button>' +
      pratikExtraBtns +
      "</div>";
    if (!f.hatali) return html;
    var katHtml = '<div class="flag-bar" style="margin-top:6px">' +
      HATA_KATEGORILERI.map(function (k) {
        return '<button class="flag-btn' + (f.kategori === k.key ? " active-report" : "") + '" data-action="set-flag-kategori" data-guid="' + guid + '" data-kategori="' + k.key + '">' + escapeHtml(k.etiket) + "</button>";
      }).join("") + "</div>";
    var notuHtml = '<textarea class="hata-notu" placeholder="Ek not (opsiyonel — eksik şık, güncel olmayan bilgi, teyit gerekiyor…)" data-note-guid="' + guid + '">' + escapeHtml(f.hataNotu) + "</textarea>";
    return html + katHtml + notuHtml;
  }

  function renderExam() {
    var idx = currentExam.index;
    var guid = currentExam.sorular[idx];
    var q = oturumSorusu(currentExam, STATE.bank, guid);
    if (!q) return '<div class="card">Bu soru artık havuzda yok (banka güncellendi). <button class="btn" data-action="back-menu">Ana Menü</button></div>';
    var secilen = currentExam.cevaplar[guid];
    var harfler = ["A", "B", "C", "D"];

    var uyariHtml = currentExam.uyarilar.length
      ? '<div class="banner">' + currentExam.uyarilar.map(escapeHtml).join(" · ") + "</div>" : "";

    var optionsHtml = q.siklar.map(function (s, i) {
      if (!s) return "";
      var cls = "option-row" + (secilen === i ? " selected" : "");
      return '<div class="' + cls + '" data-action="select-option" data-guid="' + guid + '" data-idx="' + i + '">' +
        '<span class="option-letter">' + harfler[i] + '</span><span class="option-text">' + escapeHtml(s) +
        '</span><span class="kbd-hint">' + (i + 1) + "</span></div>";
    }).join("");

    var qgrid = currentExam.sorular.map(function (g, i) {
      var answered = currentExam.cevaplar[g] !== undefined;
      var cls = (answered ? "answered " : "") + (i === idx ? "current" : "");
      return '<button data-action="goto-q" data-idx="' + i + '" class="' + cls.trim() + '">' + (i + 1) + "</button>";
    }).join("");

    var progress = Math.round(((idx + 1) / currentExam.sorular.length) * 100);
    var isLast = idx === currentExam.sorular.length - 1;
    var cevapsizSayisi = currentExam.sorular.length - Object.keys(currentExam.cevaplar).length;

    return uyariHtml +
      '<div class="progressbar"><div style="width:' + progress + '%"></div></div>' +
      '<div class="card">' +
      '<div class="q-meta"><span>' + MOD_ADI[currentExam.tip] + " · " + (idx + 1) + " / " + currentExam.sorular.length + " · " + konuDotHtml(q.konu) + escapeHtml(q.konu) + "</span>" +
      '<span id="exam-timer" class="exam-timer" title="Geçen süre — resmi sınav 50 soru / 60 dk">⏱ ' + fmtSure(currentExam.gecenSaniye || 0) + "</span></div>" +
      kopyalaButonHtml("exam") +
      '<div class="q-text">' + escapeHtml(q.soru) + "</div>" +
      optionsHtml +
      flagBarHtml(guid) +
      '<div class="qgrid">' + qgrid + "</div>" +
      '<div class="exam-nav">' +
      '<div class="link-row">' +
      '<button class="btn" data-action="prev-q" ' + (idx === 0 ? "disabled" : "") + ">← Önceki</button>" +
      (isLast ? "" : '<button class="btn" data-action="next-q">Sonraki →</button>') +
      "</div>" +
      '<div class="link-row">' +
      '<button class="btn ghost" data-action="pause-exam">Kaydet ve Çık</button>' +
      '<button class="btn primary" data-action="finish-exam">' + (isLast ? "Sınavı Bitir" : "Erken Bitir") +
      (cevapsizSayisi ? " (" + cevapsizSayisi + " boş)" : "") + "</button>" +
      "</div></div></div>";
  }

  function renderFlash() {
    var q = flashSoruBul(currentFlash);
    if (!q) return '<div class="card">Bu soru artık havuzda yok. <button class="btn" data-action="next-flash">Sonraki Soru</button></div>';
    var pratikMi = currentFlash.kaynak === "practice";
    var konuBakMi = !pratikMi && !!currentFlash.konuFiltre;
    var secilen = currentFlash.secilen;
    var answered = secilen !== null;
    var harfler = ["A", "B", "C", "D"];

    var optionsHtml = q.siklar.map(function (s, i) {
      if (!s) return "";
      var cls = "option-row";
      if (answered) {
        if (i === q.cevapIdx) cls += " correct";
        else if (i === secilen) cls += " wrong";
      } else if (secilen === i) cls += " selected";
      var action = answered ? "" : ' data-action="select-flash-option" data-idx="' + i + '"';
      return '<div class="' + cls + '"' + action + '>' +
        '<span class="option-letter">' + harfler[i] + '</span><span class="option-text">' + escapeHtml(s) +
        '</span>' + (answered ? "" : '<span class="kbd-hint">' + (i + 1) + "</span>") + "</div>";
    }).join("");

    var sonucHtml = "";
    if (answered) {
      var dogruMu = secilen === q.cevapIdx;
      sonucHtml = '<div class="pill ' + (dogruMu ? "good" : "bad") + '" style="margin:10px 0">' + (dogruMu ? "Doğru!" : "Yanlış — doğrusu " + harfler[q.cevapIdx]) + "</div>" +
        (q.aciklama ? '<div class="review-expl">' + escapeHtml(q.aciklama) + (q.kaynak ? " — " + escapeHtml(q.kaynak) : "") + "</div>" : "");
    }

    var geriAction = pratikMi ? "open-menu-test" : (konuBakMi ? "open-deneme-konu-sec" : "back-menu");
    var geriEtiket = pratikMi ? "← Test Sayfası" : (konuBakMi ? "← Konu Seç" : "Ana Menüye Dön");
    // Çıkış aksiyonları üstte, sol/sağ ayrık (sol: sayfadan çık, sağ: testi bitir) —
    // devam aksiyonları (Önceki/Sonraki Soru) sticky alt barda ayrı bir grup olarak
    // duruyor; birbirine yakın, karışık bir buton kümesi yerine iki amaç görsel
    // olarak ayrışıyor (7 Eyl 2026, kullanıcı isteği).
    var cikisRow = '<div class="link-row" style="justify-content:space-between;margin-bottom:10px">' +
      '<button class="btn ghost" data-action="' + geriAction + '">' + geriEtiket + "</button>" +
      (currentFlash.oturum.length ? '<button class="btn" data-action="finish-flash">✅ Testi Bitir (' + currentFlash.oturum.length + ")</button>" : "") +
      "</div>";
    var navHtml = '<div class="sticky-next-bar link-row">' +
      '<button class="btn ghost" data-action="prev-flash"' + (currentFlash.konum <= 0 ? " disabled" : "") + ">← Önceki Soru</button>" +
      '<button class="btn' + (answered ? " primary" : "") + '" data-action="next-flash">Sonraki Soru →</button>' +
      "</div>";

    var kaynakEtiket = pratikMi
      ? "🎲 Rastgele Soru · pratik havuzu · " + escapeHtml(q.modul + " — " + modulAdi(q.konu, q.modul))
      : konuBakMi
        ? "📖 Konu Konu Bak · " + escapeHtml(currentFlash.konuFiltre)
        : "🎲 Rastgele Soru";
    return '<div class="card">' +
      cikisRow +
      '<div class="q-meta"><span>' + kaynakEtiket + " · bu oturumda " + (flashSayac + 1) + ". soru</span><span>" + konuDotHtml(q.konu) + escapeHtml(q.konu) + "</span></div>" +
      kopyalaButonHtml("flash") +
      '<div class="q-text">' + escapeHtml(q.soru) + "</div>" +
      optionsHtml + sonucHtml +
      (answered ? flagBarHtml(q.guid, pratikMi) : "") +
      navHtml +
      "</div>";
  }

  function flashSonucKirilimi(oturum) {
    // {konu: {dogru, yanlis}} — bu oturumda konu bazında kaç doğru/yanlış yapıldı.
    var kirilim = {};
    oturum.forEach(function (kayit) {
      if (!kirilim[kayit.konu]) kirilim[kayit.konu] = { dogru: 0, yanlis: 0 };
      if (kayit.dogru) kirilim[kayit.konu].dogru++; else kirilim[kayit.konu].yanlis++;
    });
    return kirilim;
  }

  function flashYuzdeHtml(sayi, toplam) {
    if (!toplam) return sayi + " (—)";
    return sayi + " (%" + Math.round((sayi / toplam) * 100) + ")";
  }

  function renderFlashResult() {
    var r = lastFlashResult;
    var pratikMi = r.kaynak === "practice";
    var konuBakMi = !pratikMi && !!r.konuFiltre;
    var toplam = r.oturum.length;
    var dogru = r.oturum.filter(function (k) { return k.dogru; }).length;
    var yanlis = toplam - dogru;
    var kirilim = flashSonucKirilimi(r.oturum);
    var konular = Object.keys(kirilim).sort(function (a, b) {
      return KONU_SIRA.indexOf(a) - KONU_SIRA.indexOf(b);
    });
    var topicRows = konular.map(function (konu) {
      var k = kirilim[konu];
      var kToplam = k.dogru + k.yanlis;
      return "<tr><td>" + basariNoktaHtml(k.dogru, kToplam) + escapeHtml(konu) + '</td><td class="num">' + kToplam +
        '</td><td class="num">' + flashYuzdeHtml(k.dogru, kToplam) +
        '</td><td class="num">' + flashYuzdeHtml(k.yanlis, kToplam) + "</td></tr>";
    }).join("");

    var geriAction = pratikMi ? "open-menu-test" : (konuBakMi ? "open-deneme-konu-sec" : "back-menu");
    var geriEtiket = pratikMi ? "← Test Sayfası" : (konuBakMi ? "← Konu Seç" : "Ana Menüye Dön");
    var baslikEk = pratikMi ? " (pratik havuzu)" : (konuBakMi ? " (Konu Konu Bak — " + escapeHtml(r.konuFiltre) + ")" : "");
    var yeniOturumEtiket = konuBakMi ? "Bu Konuda Yeni Oturum" : "Yeni Rastgele Soru Oturumu";

    return '<div class="card">' +
      '<div class="section-title">Rastgele Soru — oturum özeti' + baslikEk + "</div>" +
      '<div class="score-hero"><span class="big">' + dogru + " / " + toplam + "</span>" +
      '<span class="pill good">' + flashYuzdeHtml(dogru, toplam) + " doğru</span>" +
      '<span class="pill bad">' + flashYuzdeHtml(yanlis, toplam) + " yanlış</span></div>" +
      (toplam
        ? '<table class="topic-table"><thead><tr><th>Ders</th><th class="num">Soru</th><th class="num">Doğru</th><th class="num">Yanlış</th></tr></thead><tbody>' +
          topicRows + "</tbody></table>"
        : '<div class="muted">Hiç soru cevaplanmadan bitirildi.</div>') +
      '<div class="link-row" style="margin-top:14px">' +
      '<button class="btn primary" data-action="start-flash-again" data-kaynak="' + r.kaynak + '" data-konu="' + escapeHtml(r.konuFiltre || "") + '">' + yeniOturumEtiket + "</button>" +
      '<button class="btn ghost" data-action="' + geriAction + '">' + geriEtiket + "</button>" +
      "</div></div>";
  }

function pratikEnIyiHtml(konu, modulKey) {
    var b = STATE.pBest[konu] && STATE.pBest[konu][modulKey];
    if (!b) return " · henüz denenmedi";
    return " · en iyi: " + b.dogru + " doğru · " + b.yanlis + " yanlış";
  }

  // En iyi sonucun başarı yüzdesine göre renk döner (yeşil ≥%80, sarı %60-79,
  // kırmızı <%60); hiç denenmemişse null — çağıran taraf nötr/soluk görünümü kendi karar verir.
  function pratikBasariRenk(konu, modulKey) {
    var b = STATE.pBest[konu] && STATE.pBest[konu][modulKey];
    if (!b) return null;
    var pct = b.dogru / (b.dogru + b.yanlis);
    return pct >= 0.8 ? "var(--good)" : pct >= 0.6 ? "var(--warn)" : "var(--bad)";
  }

  function pratikTileStil(konu, modulKey) {
    // Modül kartının çerçeve rengini en iyi sonuca göre boyar; hiç denenmemişse
    // nötr çerçeve + soluk (faded) görünüm — kart yine tıklanabilir, yalnız
    // görsel ağırlığı düşük.
    var renk = pratikBasariRenk(konu, modulKey);
    if (!renk) return 'style="border-left:4px solid var(--border);opacity:0.6"';
    return 'style="border-left:4px solid ' + renk + '"';
  }

  // Herhangi bir doğru/toplam çiftine göre küçük bir başarı noktası — konu-dot ile
  // aynı görsel dil (pratikBasariRenk'teki eşiklerle uyumlu: yeşil ≥%80, sarı %60-79,
  // kırmızı <%60), ama konu kimliği değil o anki sonucu gösterir. Rastgele Soru
  // oturum özetindeki ders kırılımında kullanılır — modül kutucuklarında DEĞİL
  // (kullanıcı isteği, 2 Eyl 2026: "modül kutusunda değil test bitiminde, rastgele
  // soruda olsun").
  function basariNoktaHtml(dogru, toplam) {
    if (!toplam) return '<span class="konu-dot" style="background:var(--border)"></span>';
    var pct = dogru / toplam;
    var renk = pct >= 0.8 ? "var(--good)" : pct >= 0.6 ? "var(--warn)" : "var(--bad)";
    return '<span class="konu-dot" style="background:' + renk + '" title="Bu oturumdaki sonuç"></span>';
  }

  function pratikDevamHtml(konu, modulKey) {
    // Modül kartında "yarım kaldı" rozeti — kaç soruda kalındığını gösterir.
    var s = pratikSlotOku(konu, modulKey);
    if (!s) return "";
    return '<div class="desc" style="color:var(--accent-strong);font-weight:600">▶ yarım kaldı: ' +
      Object.keys(s.cevaplar || {}).length + " / " + s.kuyruk.length + "</div>";
  }

  function pratikAltSecimHtml(konu, modulKey) {
    // Seçilen modülün ALTINA (grid'in en sonuna değil) açılır — grid-column:1/-1 ile
    // tam genişlikte kendi satırına düşer, sonraki tile'ları bir alt satıra iter.
    // Amaç: uzun modül listelerinde "Nasıl çalışmak istersin?" için sayfanın en
    // altına kadar kaydırma gerekmesin.
    var havuz2 = pratikHavuz(konu, modulKey);
    var yanlisSayisi = havuz2.filter(function (q) { return STATE.pStats[q.guid] && STATE.pStats[q.guid].sonSonucDogruMu === false; }).length;
    var slot = pratikSlotOku(konu, modulKey);
    var devamHtml = slot
      ? '<div class="card" style="grid-column:1/-1;border-left:4px solid var(--accent)">' +
        '<div class="title">▶ Yarım kalan oturum</div>' +
        '<div class="desc">' + Object.keys(slot.cevaplar || {}).length + " / " + slot.kuyruk.length +
          " soru cevaplanmış · " + fmtTarih(slot.savedAtISO) + "</div>" +
        '<div class="link-row" style="margin-top:10px">' +
        '<button class="btn primary" data-action="devam-pratik" data-konu="' + escapeHtml(konu) + '" data-modul="' + escapeHtml(modulKey) + '">Kaldığım Yerden Devam Et</button>' +
        '<button class="btn ghost" data-action="pratik-slot-at" data-konu="' + escapeHtml(konu) + '" data-modul="' + escapeHtml(modulKey) + '">Sil</button>' +
        "</div></div>"
      : "";
    return devamHtml + '<div class="card" style="grid-column:1/-1"><div class="section-title">' +
      (slot ? "…ya da baştan başla" : "Nasıl çalışmak istersin?") + "</div>" +
      '<div class="mode-grid">' +
      '<button class="mode-btn" data-action="start-pratik" data-mod="siray"><div class="title">Sırayla</div><div class="desc">Tüm sorular, her seferinde karışık sırada.</div></button>' +
      '<button class="mode-btn" data-action="start-pratik" data-mod="az"><div class="title">Az Görülenler</div><div class="desc">En az karşılaştıkların — oturum başına en fazla ' +
        (modulKey === PRATIK_TUM_MODULLER ? PRATIK_KARISIK_LIMIT : PRATIK_AZ_GORULEN_TEK_MODUL_LIMIT) + " soru, her seferinde dönerek.</div></button>" +
      '<button class="mode-btn" ' + (yanlisSayisi ? "" : "disabled") + ' data-action="start-pratik" data-mod="yanlis"><div class="title">Yanlışlar</div><div class="desc">Önce son denemesinde yanlış yaptıkların (' + yanlisSayisi + ").</div></button>" +
      "</div></div>";
  }

  function renderPratikModul() {
    var konu = pratikSeciliKonu;
    var modlar = MODUL_TANIMLARI[konu] || [];
    var karisikHavuz = pratikHavuz(konu, PRATIK_TUM_MODULLER);
    var karisikSecili = pratikSeciliModul === PRATIK_TUM_MODULLER;
    var karisikTile = '<button class="mode-btn' + (karisikSecili ? " selected" : "") + '" ' + pratikTileStil(konu, PRATIK_TUM_MODULLER) + ' data-action="select-pratik-modul" data-modul="' + PRATIK_TUM_MODULLER + '">' +
      '<div class="title">🔀 Karışık — Tüm Modüller</div>' +
      '<div class="desc">' + karisikHavuz.length + " soruluk havuzdan oturum başına " + PRATIK_KARISIK_LIMIT + " soru" + pratikEnIyiHtml(konu, PRATIK_TUM_MODULLER) +
      "</div>" + pratikDevamHtml(konu, PRATIK_TUM_MODULLER) + "</button>" +
      (karisikSecili ? pratikAltSecimHtml(konu, PRATIK_TUM_MODULLER) : "");
    var tiles = karisikTile + modlar.map(function (m) {
      var havuz = pratikHavuz(konu, m.key);
      var secili = pratikSeciliModul === m.key;
      return '<button class="mode-btn' + (secili ? " selected" : "") + '" ' + pratikTileStil(konu, m.key) + ' data-action="select-pratik-modul" data-modul="' + m.key + '">' +
        '<div class="title">' + escapeHtml(m.key + " — " + m.ad) + "</div>" +
        '<div class="desc">' + havuz.length + " soru" + pratikEnIyiHtml(konu, m.key) + "</div>" +
        pratikDevamHtml(konu, m.key) + "</button>" +
        (secili ? pratikAltSecimHtml(konu, m.key) : "");
    }).join("");

    return '<div class="link-row"><button class="btn" data-action="pratik-konu-geri">← Konulara Dön</button>' +
      '<button class="btn ghost" data-action="back-menu">Ana Menü</button></div>' +
      '<div class="section-title">' + konuDotHtml(konu) + escapeHtml(konu) + " — modül seç</div>" +
      '<div class="mode-grid">' + tiles + "</div>";
  }

  function renderPratikSoru() {
    if (!currentPratik) return '<div class="card">Oturum bulunamadı. <button class="btn" data-action="back-menu">Ana Menü</button></div>';

    if (currentPratik.bitti) {
      var skor = pratikOturumSkoru(currentPratik);
      var toplamCevaplanan = skor.dogru + skor.yanlis;
      var skorHtml = toplamCevaplanan
        ? '<div class="score-hero"><span class="pill good">' + skor.dogru + " doğru</span>" +
          '<span class="pill bad">' + skor.yanlis + " yanlış</span></div>"
        : "";
      var sonrakiModul = pratikSonrakiModul(currentPratik.konu, currentPratik.modul);
      var modulKirilimHtml = "";
      if (currentPratik.modul === PRATIK_TUM_MODULLER && toplamCevaplanan) {
        var kirilim = pratikModulKirilimi(currentPratik);
        var modulSirasi = (MODUL_TANIMLARI[currentPratik.konu] || []).map(function (m) { return m.key; });
        var kirilimAnahtarlari = Object.keys(kirilim).sort(function (a, b) { return modulSirasi.indexOf(a) - modulSirasi.indexOf(b); });
        var kirilimRows = kirilimAnahtarlari.map(function (modulKey) {
          var k = kirilim[modulKey], kToplam = k.dogru + k.yanlis;
          return "<tr><td>" + escapeHtml(modulKey + " — " + modulAdi(currentPratik.konu, modulKey)) + '</td><td class="num">' + kToplam +
            '</td><td class="num">' + flashYuzdeHtml(k.dogru, kToplam) +
            '</td><td class="num">' + flashYuzdeHtml(k.yanlis, kToplam) + "</td></tr>";
        }).join("");
        modulKirilimHtml = '<table class="topic-table" style="margin-top:12px"><thead><tr><th>Modül</th><th class="num">Soru</th><th class="num">Doğru</th><th class="num">Yanlış</th></tr></thead><tbody>' +
          kirilimRows + "</tbody></table>";
      }
      return '<div class="card"><div class="section-title">Modül bitti 🎉</div>' +
        '<div class="muted">' + escapeHtml(currentPratik.konu) + " · " + escapeHtml(modulAdi(currentPratik.konu, currentPratik.modul)) +
        " — " + currentPratik.kuyruk.length + " soru tamamlandı.</div>" +
        skorHtml + modulKirilimHtml +
        '<div class="link-row" style="margin-top:14px">' +
        (sonrakiModul
          ? '<button class="btn primary" data-action="pratik-sonraki-modul">Sonraki Modül: ' + escapeHtml(sonrakiModul.key + " — " + sonrakiModul.ad) + " →</button>" +
            '<button class="btn" data-action="pratik-tekrar">Aynı Şekilde Tekrar Başlat</button>'
          : '<button class="btn primary" data-action="pratik-tekrar">Aynı Şekilde Tekrar Başlat</button>') +
        '<button class="btn" data-action="pratik-listeye-don">Modül Listesine Dön</button>' +
        '<button class="btn ghost" data-action="back-menu">Ana Menüye Dön</button>' +
        "</div></div>";
    }

    var guid = currentPratik.kuyruk[currentPratik.index];
    var q = pratikSoruBul(guid);
    if (!q) return '<div class="card">Bu soru artık havuzda yok (banka güncellendi). <button class="btn" data-action="pratik-sonraki">Sonraki Soru</button></div>';

    var cevaplananSayisi = Object.keys(currentPratik.cevaplar).length;
    var cikisRow = '<div class="link-row" style="margin-bottom:10px">' +
      '<button class="btn primary" data-action="pratik-kaydet-cik">💾 Kaydet ve Çık</button>' +
      '<button class="btn ghost" data-action="pratik-listeye-don">← Modülden Çık</button>' +
      '<span class="muted" style="font-size:0.82rem;align-self:center">' + cevaplananSayisi + " / " + currentPratik.kuyruk.length +
      " cevaplandı · ilerleme her soruda otomatik kaydediliyor</span>" +
      "</div>";

    var karisikOnEki = currentPratik.modul === PRATIK_TUM_MODULLER ? "🔀 " : "";
    var meta = '<div class="q-meta"><span>' + karisikOnEki + escapeHtml(q.modul + " — " + modulAdi(q.konu, q.modul)) + " · " +
      (currentPratik.index + 1) + " / " + currentPratik.kuyruk.length + "</span><span>" + konuDotHtml(q.konu) + escapeHtml(q.konu) + "</span></div>";

    var harfler = ["A", "B", "C", "D"];
    var secilen = currentPratik.secilen;
    var answered = currentPratik.cevaplandi;
    var optionsHtml = q.siklar.map(function (s, i) {
      if (!s) return "";
      var cls = "option-row";
      if (answered) {
        if (i === q.cevapIdx) cls += " correct";
        else if (i === secilen) cls += " wrong";
      }
      var action = answered ? "" : ' data-action="select-pratik-option" data-idx="' + i + '"';
      return '<div class="' + cls + '"' + action + '>' +
        '<span class="option-letter">' + harfler[i] + '</span><span class="option-text">' + escapeHtml(s) +
        '</span>' + (answered ? "" : '<span class="kbd-hint">' + (i + 1) + "</span>") + "</div>";
    }).join("");
    var sonucHtml = "";
    if (answered) {
      var dogruMu = secilen === q.cevapIdx;
      sonucHtml = '<div class="pill ' + (dogruMu ? "good" : "bad") + '" style="margin:10px 0">' +
        (dogruMu ? "Doğru!" : "Yanlış — doğrusu " + harfler[q.cevapIdx]) + "</div>" +
        (q.aciklama ? '<div class="review-expl">' + escapeHtml(q.aciklama) + "</div>" : "");
    }
    var body = optionsHtml + sonucHtml;

    var kaynakHtml = q.kaynak ? '<div class="muted" style="font-size:0.82rem;margin-top:8px">' + escapeHtml(q.kaynak) + "</div>" : "";
    var altNav = "";
    if (currentPratik.cevaplandi) {
      altNav = flagBarHtml(guid, true) +
        '<div class="sticky-next-bar link-row">' +
        '<button class="btn primary" data-action="pratik-sonraki">Sonraki Soru →</button>' +
        "</div>";
    }

    return '<div class="card">' + cikisRow + meta + kopyalaButonHtml("pratik") + '<div class="q-text">' + escapeHtml(q.soru) + "</div>" + body + kaynakHtml + altNav + "</div>";
  }

  function renderResult() {
    var r = lastResult;
    var toplam = r.skor.dogru + r.skor.yanlis + r.skor.bos;
    var topicRows = Object.keys(r.konuKirilim).map(function (konu) {
      var k = r.konuKirilim[konu];
      return "<tr><td>" + konuDotHtml(konu) + escapeHtml(konu) + '</td><td class="num">' + k.dogru + '</td><td class="num">' + k.yanlis +
        '</td><td class="num">' + k.bos + "</td></tr>";
    }).join("");

    var bankByGuid = {};
    STATE.bank.forEach(function (q) { bankByGuid[q.guid] = q; });
    var yanlisBosListesi = r.sorular.map(function (guid) {
      var q = oturumSorusu(r, STATE.bank, guid);
      if (!q) return "";
      var secilen = r.cevaplar[guid];
      if (secilen === q.cevapIdx) return "";
      var harfler = ["A", "B", "C", "D"];
      var optionsHtml = q.siklar.map(function (s, i) {
        if (!s) return "";
        var cls = "option-row";
        if (i === q.cevapIdx) cls += " correct"; else if (i === secilen) cls += " wrong";
        return '<div class="' + cls + '"><span class="option-letter">' + harfler[i] + '</span><span class="option-text">' + escapeHtml(s) + "</span></div>";
      }).join("");
      var bosHtml = (secilen === undefined || secilen === null) ? '<div class="review-opt wrong">Boş bırakıldı</div>' : "";
      var badge = q.dogrulanmis === false ? '<span class="badge unverified">doğrulanmamış</span>' : "";
      return '<div class="review-item"><div class="review-q">' + escapeHtml(q.soru) + badge + "</div>" +
        bosHtml + optionsHtml +
        (q.aciklama ? '<div class="review-expl">' + escapeHtml(q.aciklama) + (q.kaynak ? " — " + escapeHtml(q.kaynak) : "") + "</div>" : "") +
        flagBarHtml(guid) +
        "</div>";
    }).join("");

    var kod = r.examCode || examKoduUret(r.tip, r.seed);
    var koduAciklama = r.uzak
      ? 'Bu kod bu resmi denemenin kaydıdır — "Kod ile Çöz" alanına girersen aynı soruları (Yeni Sınav modunda herkes için, diğerlerinde kişisel istatistiğe göre) yeniden çözersin.'
      : 'Bu kodu Deneme sayfasındaki "Kod ile Çöz" alanına girersen aynı soruları tekrar çözersin.';
    var koduHtml = kod
      ? '<div class="muted" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">Deneme kodu: ' +
        '<b style="font-family:var(--font-display);letter-spacing:0.03em">' + kod + '</b> ' +
        '<button class="btn ghost" style="padding:2px 8px;font-size:0.76rem;margin-left:4px" data-action="copy-exam-code" data-kod="' + kod + '">📋 Kopyala</button>' +
        '<br>' + koduAciklama + '</div>'
      : "";
    var yuzde = toplam ? Math.round((r.skor.dogru / toplam) * 100) : null;
    var yuzdeHtml = yuzde === null ? "" : '<span class="pill" style="background:var(--surface-2);color:' + renkEsigi(yuzde) + '">%' + yuzde + "</span>";
    var sureHtml = typeof r.sureSaniye === "number" ? '<span class="muted" style="font-size:0.86rem">⏱ ' + fmtSure(r.sureSaniye) + " sürede bitti</span>" : "";

    return '<div class="card">' +
      '<div class="score-hero"><span class="big">' + r.skor.dogru + " / " + toplam + "</span>" +
      '<span class="pill good">' + r.skor.dogru + " doğru</span>" +
      '<span class="pill bad">' + r.skor.yanlis + " yanlış</span>" +
      '<span class="pill warn">' + r.skor.bos + " boş</span>" +
      yuzdeHtml + sureHtml + "</div>" +
      '<table class="topic-table"><thead><tr><th>Konu</th><th class="num">Doğru</th><th class="num">Yanlış</th><th class="num">Boş</th></tr></thead><tbody>' +
      topicRows + "</tbody></table>" +
      '<div class="link-row" style="margin-top:14px">' +
      '<button class="btn primary" data-action="back-menu">' + (STATE.sadeceDeneme ? "Tamam" : "Ana Menüye Dön") + '</button>' +
      '<button class="btn" data-action="copy-result-image">🖼 Sonucu Kopyala</button>' +
      "</div>" +
      koduHtml +
      "</div>" +
      (yanlisBosListesi ? '<div class="card" style="margin-top:16px"><div class="section-title">Gözden geçir</div>' + yanlisBosListesi + "</div>" : "");
  }

  function renderSettings() {
    var toplam = 0;
    var rows = Object.keys(draftSettings.dagilim).map(function (konu) {
      var v = draftSettings.dagilim[konu];
      toplam += v;
      return '<div class="field-row"><span>' + escapeHtml(konu) + '</span><input type="number" min="0" value="' + v +
        '" data-dagilim-konu="' + escapeHtml(konu) + '"></div>';
    }).join("");
    var mismatch = toplam !== 50;
    return '<div class="card"><div class="section-title">Ayarlar — sınav başına konu dağılımı</div>' +
      rows +
      '<div class="settings-total' + (mismatch ? " mismatch" : "") + '">Toplam<span>' + toplam + " / 50</span></div>" +
      (mismatch ? '<div class="banner">Toplam 50 değil — yine de kaydedebilirsin, ama resmi sınav dağılımıyla uyuşmaz.</div>' : "") +
      '<div class="link-row" style="margin-top:14px">' +
      '<button class="btn primary" data-action="save-settings">Kaydet</button>' +
      '<button class="btn ghost" data-action="cancel-settings">Vazgeç</button>' +
      "</div></div>";
  }

  function renderImport() {
    var body;
    if (!importPreview) {
      body = '<label class="filepick" for="excel-file-input">Güncel .xlsx dosyasını seçmek için tıkla<br>' +
        '<span class="muted">Sütun başlıklarına göre okunur: Konu, Soru, A, B, C, D, CevapHarf, GUID…</span></label>' +
        '<input type="file" id="excel-file-input" accept=".xlsx" style="display:none">' +
        '<div class="link-row"><button class="btn ghost" data-action="cancel-import">Vazgeç</button></div>';
    } else {
      var s = importPreview.sonuc;
      body = '<div class="import-summary">' +
        '<div class="chip"><b>+' + s.eklendi + "</b>yeni soru</div>" +
        '<div class="chip"><b>' + s.guncellendi + "</b>güncellendi</div>" +
        '<div class="chip"><b>-' + s.kaldirildi + "</b>kaldırıldı (istatistiği arşivlendi)</div>" +
        '<div class="chip"><b>' + importPreview.toplamSatir + "</b>toplam soru</div>" +
        "</div>" +
        '<div class="muted" style="margin-bottom:14px">Kaynak: ' + escapeHtml(importPreview.dosyaAdi) + " · sayfa: " + escapeHtml(importPreview.sheetName) + "</div>" +
        '<div class="link-row">' +
        '<button class="btn primary" data-action="confirm-import">Onayla ve Kaydet</button>' +
        '<button class="btn ghost" data-action="cancel-import">Vazgeç</button>' +
        "</div>";
    }
    return '<div class="card"><div class="section-title">Soru Bankasını Güncelle</div>' + body + "</div>";
  }

  function renderHistory() {
    if (STATE.history.length === 0) {
      return '<div class="card">Henüz sınav geçmişi yok. <button class="btn" data-action="back-menu">Ana Menü</button></div>';
    }
    var konuBasari = {};
    STATE.bank.forEach(function (q) {
      var s = STATE.stats[q.guid];
      if (!s || s.gosterim === 0) return;
      konuBasari[q.konu] = konuBasari[q.konu] || { dogru: 0, gosterim: 0 };
      konuBasari[q.konu].dogru += s.dogru;
      konuBasari[q.konu].gosterim += s.gosterim;
    });
    var barlar = Object.keys(konuBasari).map(function (konu) {
      var pct = Math.round((konuBasari[konu].dogru / konuBasari[konu].gosterim) * 100);
      return '<div class="history-row"><span>' + konuDotHtml(konu) + escapeHtml(konu) + '</span>' +
        '<div class="bar-track" style="max-width:160px"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="muted">' + pct + "%</span></div>";
    }).join("");
    var rows = STATE.history.slice(0, 30).map(function (h) {
      var toplam = h.skor.dogru + h.skor.yanlis + h.skor.bos;
      var silHtml = deletingHistoryId === h.id
        ? '<span style="display:flex;gap:4px">' +
          '<button class="btn primary" style="padding:2px 8px;font-size:0.78rem" data-action="confirm-delete-history" data-id="' + h.id + '">Evet</button>' +
          '<button class="btn ghost" style="padding:2px 8px;font-size:0.78rem" data-action="cancel-delete-history">Vazgeç</button>' +
          "</span>"
        : '<button class="btn ghost" style="padding:2px 8px;font-size:0.78rem" data-action="request-delete-history" data-id="' + h.id + '">Sil</button>';
      return '<div class="history-row"><span>' + MOD_ADI[h.tip] + '</span><span class="when">' + fmtTarih(h.tarihISO) + "</span>" +
        "<span>" + h.skor.dogru + " / " + toplam + "</span>" + silHtml + "</div>";
    }).join("");
    return '<div class="link-row"><button class="btn ghost" data-action="back-menu">← Ana Menü</button></div>' +
      '<div class="card"><div class="section-title">Konu bazlı başarı</div>' + (barlar || '<span class="muted">Henüz veri yok.</span>') + "</div>" +
      '<div class="card" style="margin-top:16px"><div class="section-title">Sınav geçmişi</div>' + rows + "</div>";
  }

  function renderFlags() {
    var bankByGuid = {};
    STATE.bank.forEach(function (q) { bankByGuid[q.guid] = q; });
    var practiceByGuid = {};
    STATE.practiceBank.forEach(function (q) { practiceByGuid[q.guid] = q; });
    function soruByGuid(g) { return bankByGuid[g] || practiceByGuid[g]; }
    function konuEtiketi(g) {
      var q = soruByGuid(g);
      if (!q) return "";
      return practiceByGuid[g] ? q.konu + " · " + q.modul : q.konu;
    }

    var guids = Object.keys(STATE.flags);
    var hatirlaticilar = guids.filter(function (g) { return STATE.flags[g].hatirlatici && soruByGuid(g); });
    var hatalilar = guids.filter(function (g) { return STATE.flags[g].hatali && soruByGuid(g); });
    var begenilenler = guids.filter(function (g) { return STATE.flags[g].begenildi && practiceByGuid[g]; });
    var kapsamDisilar = guids.filter(function (g) { return STATE.flags[g].kapsamDisi && practiceByGuid[g]; });

    function listHtml(list, kind) {
      if (list.length === 0) return '<span class="muted">Yok.</span>';
      return list.map(function (g) {
        var q = soruByGuid(g);
        var f = STATE.flags[g];
        return '<div class="review-item"><div class="review-q">' + escapeHtml(q.soru) +
          '<span class="badge unverified">' + escapeHtml(konuEtiketi(g)) + "</span></div>" +
          (kind === "hatali" && f.hataNotu ? '<div class="review-expl">' + escapeHtml(f.hataNotu) + "</div>" : "") +
          '<div class="link-row" style="margin-top:8px">' +
          '<button class="btn" data-action="toggle-flag" data-guid="' + g + '" data-kind="' + kind + '">Kaldır</button>' +
          "</div></div>";
      }).join("");
    }

    return '<div class="link-row"><button class="btn ghost" data-action="back-menu">← Ana Menü</button></div>' +
      '<div class="card"><div class="section-title">🔖 Hatırlatıcılarım (' + hatirlaticilar.length + ")</div>" +
      listHtml(hatirlaticilar, "hatirlatici") + "</div>" +
      '<div class="card" style="margin-top:16px"><div class="section-title">🚩 Hata bildirdiklerim (' + hatalilar.length + ")</div>" +
      listHtml(hatalilar, "hatali") + "</div>" +
      '<div class="card" style="margin-top:16px"><div class="section-title">⭐ Aktarım Kuyruğu — Sınav Bankasına Aday (' + begenilenler.length + ")</div>" +
      listHtml(begenilenler, "begenildi") + "</div>" +
      '<div class="card" style="margin-top:16px"><div class="section-title">🗑️ Kapsam Dışı — Silinebilir (' + kapsamDisilar.length + ")</div>" +
      listHtml(kapsamDisilar, "kapsamDisi") + "</div>";
  }

  function renderDuzeltmeler() {
    if (STATE.duzeltmeler.length === 0) {
      return '<div class="card">Henüz düzeltme kaydı yok. <button class="btn" data-action="back-menu">Ana Menü</button></div>';
    }
    var rows = STATE.duzeltmeler.map(function (d) {
      return '<div class="review-item">' +
        '<div class="review-q">' + (d.konu ? konuDotHtml(d.konu) : "") + escapeHtml(d.soru) + "</div>" +
        '<div class="review-expl">' + escapeHtml(d.not) + "</div>" +
        '<div class="muted" style="font-size:0.78rem;margin-top:4px">' + fmtTarih(d.tarihISO) + "</div>" +
        "</div>";
    }).join("");
    return '<div class="link-row">' +
      '<button class="btn ghost" data-action="back-menu">← Ana Menü</button>' +
      '<button class="btn ghost" data-action="clear-duzeltmeler">Temizle</button>' +
      "</div>" +
      '<div class="card"><div class="section-title">✅ Düzeltilenler</div>' + rows + "</div>";
  }

  function render() {
    var html = "";
    if (STATE.sadeceDeneme && (VIEW === "menu" || VIEW === "menuTest" || VIEW === "pratikModul" || VIEW === "pratikSoru" ||
      VIEW === "checkpointListe" || VIEW === "checkpointDetay" || VIEW === "settings" || VIEW === "import")) VIEW = "menuDeneme";
    if (STATE.sadeceDeneme && !remoteGirisTamamMi() && (VIEW === "flash" || VIEW === "denemeKonuSec" || VIEW === "flashResult" || VIEW === "gecmisUzak" || VIEW === "tekrarTest" || VIEW === "tekrarSonuc")) VIEW = "menuDeneme";
    if (VIEW === "menu") html = renderMenu();
    else if (VIEW === "menuDeneme") html = renderMenuDeneme();
    else if (VIEW === "denemeKonuSec") html = renderDenemeKonuSec();
    else if (VIEW === "menuTest") html = renderMenuTest();
    else if (VIEW === "exam") html = renderExam();
    else if (VIEW === "result") html = renderResult();
    else if (VIEW === "settings") html = renderSettings();
    else if (VIEW === "import") html = renderImport();
    else if (VIEW === "history") html = renderHistory();
    else if (VIEW === "flags") html = renderFlags();
    else if (VIEW === "duzeltmeler") html = renderDuzeltmeler();
    else if (VIEW === "flash") html = renderFlash();
    else if (VIEW === "flashResult") html = renderFlashResult();
    else if (VIEW === "pratikModul") html = renderPratikModul();
    else if (VIEW === "pratikSoru") html = renderPratikSoru();
    else if (VIEW === "checkpointListe") html = renderCheckpointListe();
    else if (VIEW === "checkpointDetay") html = renderCheckpointDetay();
    else if (VIEW === "gecmisUzak") html = renderGecmisUzak();
    else if (VIEW === "tekrarTest") html = renderTekrarTest();
    else if (VIEW === "tekrarSonuc") html = renderTekrarSonuc();
    if (!html) { // eski bir sekmede kalkan artık var olmayan bir VIEW (ör. kaldırılmış "pratikKonu") gelirse boş ekran yerine ana ekrana düş
      if (STATE.sadeceDeneme) { VIEW = "menuDeneme"; html = renderMenuDeneme(); }
      else { VIEW = "menu"; html = renderMenu(); }
    }
    var bannerHtml = bannerMsg ? '<div class="banner' + (bannerIsError ? " error" : "") + '">' + escapeHtml(bannerMsg) + "</div>" : "";
    var narrowViews = { settings: true, import: true };
    var shellClass = "shell" + (narrowViews[VIEW] ? " narrow" : "");
    $app().innerHTML = '<div class="' + shellClass + '">' + bannerHtml + html + "</div>";
  }

  // ------------------------------------------------------------- olaylar --
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!t) return;
    var action = t.getAttribute("data-action");
    if (action === "open-menu-deneme") { denemeKodOnizleme = null; openMenuDeneme(); }
    else if (action === "open-menu-test") { VIEW = "menuTest"; render(); }
    else if (action === "copy-soru") kopyalaAktifSoru(t.getAttribute("data-scope"));
    else if (action === "open-deneme-konu-sec") { if (STATE.sadeceDeneme && !remoteGirisTamamMi()) return; VIEW = "denemeKonuSec"; render(); }
    else if (action === "start-deneme-konu-flash") startFlash("bank", t.getAttribute("data-konu"));
    else if (action === "start-exam") startExam(t.getAttribute("data-mode"));
    else if (action === "start-exam-code") startExamWithCode();
    else if (action === "prepare-exam-remote") prepareExamRemote(t.getAttribute("data-mode"));
    else if (action === "baslat-exam-kod-onizleme") baslatExamKodOnizleme();
    else if (action === "cancel-exam-kod-onizleme") cancelExamKodOnizleme();
    else if (action === "deneme-register") remoteRegisterSubmit();
    else if (action === "deneme-refresh") remoteRefreshStatus();
    else if (action === "deneme-cikis-yap") denemeCikisYap();
    else if (action === "deneme-accept-disclaimer") remoteAcceptDisclaimer();
    else if (action === "resume-exam-remote") resumeExamRemote();
    else if (action === "discard-exam-remote") requestDiscardExamRemote();
    else if (action === "confirm-discard-exam-remote") discardExamRemote();
    else if (action === "cancel-discard-exam-remote") cancelDiscardExamRemote();
    else if (action === "open-history-remote") openHistoryRemote();
    else if (action === "open-gecmis-detay") openGecmisDetay(t.getAttribute("data-id"));
    else if (action === "request-delete-gecmis") requestDeleteGecmis(t.getAttribute("data-id"));
    else if (action === "confirm-delete-gecmis") confirmDeleteGecmis(t.getAttribute("data-id"));
    else if (action === "cancel-delete-gecmis") cancelDeleteGecmis();
    else if (action === "copy-exam-code") kopyalaPano(t.getAttribute("data-kod"));
    else if (action === "copy-result-image") sonucGorseliKopyala();
    else if (action === "select-option") selectOption(t.getAttribute("data-guid"), parseInt(t.getAttribute("data-idx"), 10));
    else if (action === "next-q") nextQuestion();
    else if (action === "prev-q") prevQuestion();
    else if (action === "goto-q") gotoQuestion(parseInt(t.getAttribute("data-idx"), 10));
    else if (action === "finish-exam") finishExam();
    else if (action === "back-menu") backToMenu();
    else if (action === "open-settings") openSettings();
    else if (action === "save-settings") saveSettings();
    else if (action === "cancel-settings") { VIEW = "menu"; render(); }
    else if (action === "open-import") openImport();
    else if (action === "confirm-import") confirmImport();
    else if (action === "cancel-import") { importPreview = null; VIEW = "menu"; render(); }
    else if (action === "open-history") { VIEW = "history"; render(); }
    else if (action === "open-flags") { VIEW = "flags"; render(); }
    else if (action === "open-duzeltmeler") { VIEW = "duzeltmeler"; render(); }
    else if (action === "clear-duzeltmeler") { STATE.duzeltmeler = []; pendingSaveDirty = true; render(); }
    else if (action === "toggle-flag") toggleFlag(t.getAttribute("data-guid"), t.getAttribute("data-kind"));
    else if (action === "set-flag-kategori") setFlagKategori(t.getAttribute("data-guid"), t.getAttribute("data-kategori"));
    else if (action === "start-hatirlatici-test") startTekrarTest("hatirlatici");
    else if (action === "start-yanlis-tekrar-test") startTekrarTest("yanlis");
    else if (action === "start-tekrar-again") startTekrarTest(t.getAttribute("data-tur"));
    else if (action === "select-tekrar-option") selectTekrarOption(parseInt(t.getAttribute("data-idx"), 10));
    else if (action === "next-tekrar-soru") nextTekrarSoru();
    else if (action === "prev-tekrar-soru") prevTekrarSoru();
    else if (action === "finish-tekrar-test") finishTekrarTest();
    else if (action === "retry-tekrar-kayit") retryTekrarKayit();
    else if (action === "tekrar-cik") tekrarCik();
    else if (action === "export-hatirlatici-word") exportHatirlaticiWord();
    else if (action === "pause-exam") pauseExam();
    else if (action === "resume-exam") resumeExam();
    else if (action === "discard-paused") requestDiscardPausedExam();
    else if (action === "confirm-discard-paused") discardPausedExam();
    else if (action === "cancel-discard-paused") cancelDiscardPausedExam();
    else if (action === "start-flash") startFlash();
    else if (action === "start-flash-again") startFlash(t.getAttribute("data-kaynak"), t.getAttribute("data-konu"));
    else if (action === "next-flash") nextFlash();
    else if (action === "prev-flash") prevFlash();
    else if (action === "finish-flash") finishFlash();
    else if (action === "select-flash-option") selectFlashOption(parseInt(t.getAttribute("data-idx"), 10));
    else if (action === "request-delete-history") requestDeleteHistory(t.getAttribute("data-id"));
    else if (action === "confirm-delete-history") deleteHistoryEntry(t.getAttribute("data-id"));
    else if (action === "cancel-delete-history") cancelDeleteHistory();
    else if (action === "select-pratik-konu") {
      var pk = t.getAttribute("data-konu");
      if (MODUL_TANIMLARI[pk]) { pratikSeciliKonu = pk; pratikSeciliModul = null; VIEW = "pratikModul"; render(); }
    }
    else if (action === "pratik-konu-geri") { VIEW = "menuTest"; pratikSeciliKonu = null; pratikSeciliModul = null; render(); }
    else if (action === "open-checkpoint-liste") { checkpointSeciliKonu = null; checkpointSeciliId = null; VIEW = "checkpointListe"; render(); }
    else if (action === "select-checkpoint-konu") { checkpointSeciliKonu = t.getAttribute("data-konu"); VIEW = "checkpointListe"; render(); }
    else if (action === "checkpoint-konu-geri") { checkpointSeciliId = null; VIEW = "checkpointListe"; render(); }
    else if (action === "open-checkpoint-detay") { checkpointSeciliId = t.getAttribute("data-id"); VIEW = "checkpointDetay"; render(); }
    else if (action === "select-pratik-modul") {
      var secilenModul = t.getAttribute("data-modul");
      // Yarım kalan oturum varsa doğrudan başlatma — "Devam Et"i göstermek için modülü seç,
      // yoksa eskisi gibi tek tıkla "Sırayla" başlar.
      if (secilenModul === PRATIK_TUM_MODULLER || pratikSlotOku(pratikSeciliKonu, secilenModul)) {
        pratikSeciliModul = (pratikSeciliModul === secilenModul) ? null : secilenModul; render();
      } else startPratikOturum(pratikSeciliKonu, secilenModul, "siray");
    }
    else if (action === "devam-pratik") {
      var dk = t.getAttribute("data-konu"), dm = t.getAttribute("data-modul");
      pratikSeciliKonu = dk; pratikSeciliModul = dm;
      devamPratikOturum(dk, dm);
    }
    else if (action === "pratik-slot-at") pratikSlotAt(t.getAttribute("data-konu"), t.getAttribute("data-modul"));
    else if (action === "pratik-kaydet-cik") pratikKaydetVeCik();
    else if (action === "start-pratik-flash") startFlash("practice");
    else if (action === "start-pratik") startPratikOturum(pratikSeciliKonu, pratikSeciliModul, t.getAttribute("data-mod"));
    else if (action === "select-pratik-option") selectPratikOption(parseInt(t.getAttribute("data-idx"), 10));
    else if (action === "pratik-sonraki") nextPratikSoru();
    else if (action === "pratik-tekrar") pratikTekrarBaslat();
    else if (action === "pratik-sonraki-modul") pratikSonrakiModuleBaslat();
    else if (action === "pratik-listeye-don") pratikListeyeDon();
  });
  document.addEventListener("input", function (e) {
    if (e.target && e.target.matches && e.target.matches("[data-dagilim-konu]")) {
      updateDraftDagilim(e.target.getAttribute("data-dagilim-konu"), e.target.value);
    }
    if (e.target && e.target.id === "deneme-username-input") denemeIsimTaslak = e.target.value;
    if (e.target && e.target.id === "deneme-pin-input") denemePinTaslak = e.target.value;
  });
  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "excel-file-input" && e.target.files && e.target.files[0]) {
      handleFileSelect(e.target.files[0]);
    }
    if (e.target && e.target.matches && e.target.matches("[data-note-guid]")) {
      saveHataNotu(e.target.getAttribute("data-note-guid"), e.target.value);
    }
  });
  document.addEventListener("keydown", function (e) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") {
      if (e.key === "Enter" && document.activeElement.id === "exam-code-input") { e.preventDefault(); startExamWithCode(); }
      return;
    }
    if (VIEW === "exam" && currentExam) {
      if (e.key >= "1" && e.key <= "4") {
        var idx = parseInt(e.key, 10) - 1;
        var guid = currentExam.sorular[currentExam.index];
        var q = oturumSorusu(currentExam, STATE.bank, guid);
        if (q && q.siklar[idx]) { e.preventDefault(); selectOption(guid, idx); }
      } else if (e.key === "ArrowRight") {
        e.preventDefault(); nextQuestion();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault(); prevQuestion();
      }
    } else if (VIEW === "flash" && currentFlash) {
      if (currentFlash.secilen === null && e.key >= "1" && e.key <= "4") {
        var fidx = parseInt(e.key, 10) - 1;
        var fq = flashSoruBul(currentFlash);
        if (fq && fq.siklar[fidx]) { e.preventDefault(); selectFlashOption(fidx); }
      } else if (e.key === "ArrowRight") {
        e.preventDefault(); nextFlash(); // cevaplanmamış olsa da atlanabilir
      } else if (e.key === "ArrowLeft") {
        e.preventDefault(); prevFlash();
      }
    } else if (VIEW === "pratikSoru" && currentPratik && !currentPratik.bitti) {
      var pq = pratikSoruBul(currentPratik.kuyruk[currentPratik.index]);
      if (pq && !currentPratik.cevaplandi && e.key >= "1" && e.key <= "4") {
        var pidx = parseInt(e.key, 10) - 1;
        if (pq.siklar[pidx]) { e.preventDefault(); selectPratikOption(pidx); }
      } else if (e.key === "ArrowRight" && currentPratik.cevaplandi) {
        e.preventDefault(); nextPratikSoru();
      }
    } else if (VIEW === "tekrarTest" && currentTekrar) {
      // Rastgele Soru ile aynı kısayollar: 1-4 seçer, ok tuşları kuyrukta gezer
      // (cevaplanmamış soru da atlanabilir).
      var tKayit = tekrarAktifKayit();
      var tq = tKayit && hatirlaticiSoruBul(tKayit.guid);
      if (tq && tKayit.secilen === null && e.key >= "1" && e.key <= "4") {
        var tidx = parseInt(e.key, 10) - 1;
        if (tq.siklar[tidx]) { e.preventDefault(); selectTekrarOption(tidx); }
      } else if (e.key === "ArrowRight") {
        e.preventDefault(); nextTekrarSoru();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault(); prevTekrarSoru();
      }
    }
  });

  // Sekme kapanırken/gizlenirken son bir yerel yazım — publish'e zaman kalmasa da veri durur.
  function sonOturumuKaydet() {
    if (VIEW === "exam" && currentExam && !currentExam.uzak) { examSlotYaz(); bumpRev(); }
    if (VIEW === "pratikSoru" && currentPratik && !currentPratik.bitti) { pratikSlotYaz(); bumpRev(); }
    lsKaydet();
  }
  window.addEventListener("pagehide", sonOturumuKaydet);
  document.addEventListener("visibilitychange", function () { if (document.hidden) sonOturumuKaydet(); });

  ensureArtifact().then(function () {
    render();
    // Açılışta yerel kayıt gömülü STATE'ten yeniyse (ör. sekme yayın yapılmadan kapanmış),
    // yayınlanan sürümü sessizce yerel veriye eşitle.
    if (yerelVeriDahaYeniydi) {
      showBanner("Kaydedilmemiş ilerleme bu tarayıcıdan geri yüklendi, kaydediliyor…", false);
      saveAndPublish();
    }
    // sadeceDeneme derlemesinde açılış doğrudan menuDeneme'dir — normalde bu kontrolü
    // tetikleyen "open-menu-deneme" tıklaması hiç olmaz, o yüzden burada da başlatılır.
    if (STATE.sadeceDeneme && !remoteAuth.checked) {
      remoteCheckStatus(function () { if (VIEW === "menuDeneme") render(); });
    }
  });
  setInterval(tickExamTimer, 1000);
})();
</script>
</body>
</html>
