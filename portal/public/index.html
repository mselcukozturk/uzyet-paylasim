  // ------------------------------------------------- Konu Çalışma / Tekrar --
  function recordPratikStat(guid, dogruMu) {
    if (!STATE.pStats[guid]) STATE.pStats[guid] = { gosterim: 0, dogru: 0, yanlis: 0, sonSonucDogruMu: null, sonGorulme: null };
    var s = STATE.pStats[guid];
    s.gosterim++;
    s.sonGorulme = new Date().toISOString();
    if (dogruMu) { s.dogru++; s.sonSonucDogruMu = true; } else { s.yanlis++; s.sonSonucDogruMu = false; }
    veriDegisti(); // localStorage'a anında yazar, yayını 25 sn'ye erteler — reload akışı bölmesin
  }

  // --- yarım kalan oturum (modül başına bir slot) ---
  function pratikSlotKey(konu, modul) { return konu + "::" + modul; }

  function pratikSlotOku(konu, modul) { return STATE.pausedPratik[pratikSlotKey(konu, modul)] || null; }

  function pratikSlotYaz() {
    // Her cevaptan sonra çağrılır: sekme kapansa bile kaldığı yerden devam edebilsin.
    // Kuyruğun tamamı saklanır, yoksa dönüşte soru sırası değişir ve "34/290" anlamsızlaşır.
    if (!currentPratik || currentPratik.bitti) return;
    STATE.pausedPratik[pratikSlotKey(currentPratik.konu, currentPratik.modul)] = {
      mod: currentPratik.mod, kuyruk: currentPratik.kuyruk, index: currentPratik.index,
      soruKayitlari: currentPratik.soruKayitlari,
      cevaplar: currentPratik.cevaplar, savedAtISO: new Date().toISOString()
    };
  }

  function pratikSlotSil(konu, modul) { delete STATE.pausedPratik[pratikSlotKey(konu, modul)]; }

  function startPratikOturum(konu, modul, mod) {
    if (!konu || !modul) return;
    var kuyruk = pratikKuyrukOlustur(konu, modul, mod);
    if (kuyruk.length === 0) { showBanner("Bu modülde henüz soru yok.", true); return; }
    pratikSlotSil(konu, modul); // yeni oturum yarım kalanın yerine geçer
    currentPratik = { konu: konu, modul: modul, mod: mod, kuyruk: kuyruk, index: 0, cevaplandi: false, secilen: null, bitti: false, cevaplar: {} };
    currentPratik.soruKayitlari = soruKayitlari(STATE.practiceBank, kuyruk);
    pratikSlotYaz();
    VIEW = "pratikSoru";
    veriDegisti();
    render();
  }

  function devamPratikOturum(konu, modul) {
    var slot = pratikSlotOku(konu, modul);
    if (!slot) return;
    // Banka güncellenmiş olabilir: artık havuzda olmayan guid'leri kuyruktan düşür.
    var gecerli = slot.kuyruk.filter(function (g) { return !!oturumSorusu(slot, STATE.practiceBank, g); });
    if (gecerli.length === 0) { pratikSlotSil(konu, modul); showBanner("Yarım kalan oturumun soruları artık havuzda yok.", true); veriDegisti(); render(); return; }
    var idx = Math.min(slot.index, gecerli.length - 1);
    currentPratik = {
      konu: konu, modul: modul, mod: slot.mod, kuyruk: gecerli, index: idx,
      cevaplandi: false, secilen: null, bitti: false, cevaplar: slot.cevaplar || {}
    };
    currentPratik.soruKayitlari = slot.soruKayitlari || soruKayitlari(STATE.practiceBank, gecerli);
    // Kaldığı soru zaten cevaplanmışsa (cevapladıktan hemen sonra çıkmışsa) bir sonrakine geç.
    var guidSimdi = gecerli[idx];
    if (currentPratik.cevaplar[guidSimdi] !== undefined) {
      if (idx < gecerli.length - 1) currentPratik.index = idx + 1;
      else { currentPratik.cevaplandi = true; currentPratik.secilen = currentPratik.cevaplar[guidSimdi]; }
    }
    VIEW = "pratikSoru";
    render();
  }

  function pratikKaydetVeCik() {
    // "Kaydet ve Çık" — yarım kalan oturumu slota yazar ve HEMEN yayınlar.
    if (currentPratik && !currentPratik.bitti) pratikSlotYaz();
    currentPratik = null;
    VIEW = "pratikModul";
    veriDegisti(true);
    render();
  }

  function pratikSlotAt(konu, modul) {
    pratikSlotSil(konu, modul);
    veriDegisti();
    render();
  }

  function selectPratikOption(idx) {
    if (!currentPratik || currentPratik.cevaplandi) return;
    var q = pratikSoruBul(currentPratik.kuyruk[currentPratik.index]);
    if (!q) { render(); return; }
    currentPratik.secilen = idx;
    currentPratik.cevaplandi = true;
    currentPratik.cevaplar[q.guid] = idx; // oturuma özel skor (Modül bitti ekranında x doğru/y yanlış için)
    recordPratikStat(q.guid, idx === q.cevapIdx); // içinde veriDegisti() var
    pratikSlotYaz();                              // ...ve konum da aynı yazımda kalıcı olsun
    lsKaydet();
    render();
  }
  function nextPratikSoru() {
    if (!currentPratik) return;
    if (currentPratik.index < currentPratik.kuyruk.length - 1) {
      currentPratik.index++;
      currentPratik.cevaplandi = false; currentPratik.secilen = null;
      pratikSlotYaz();
      veriDegisti();
    } else {
      currentPratik.bitti = true;
      pratikBestGuncelle(currentPratik);
      pratikSlotSil(currentPratik.konu, currentPratik.modul); // tamamlandı, yarım kalan yok
      veriDegisti(true); // modül bitti — bu gerçek bir çıkış noktası, hemen yayınla
    }
    render();
  }
  function pratikTekrarBaslat() {
    if (!currentPratik) return;
    startPratikOturum(currentPratik.konu, currentPratik.modul, currentPratik.mod);
  }
  function pratikListeyeDon() {
    // Oturum yarım kaldıysa kaybolmaz — slota yazılıp yayınlanır (bitmiş oturumda no-op).
    if (currentPratik && !currentPratik.bitti) { pratikSlotYaz(); veriDegisti(true); }
    currentPratik = null;
    VIEW = "pratikModul";
    render();
  }
  function pratikSonrakiModul(konu, modul) {
    var modlar = MODUL_TANIMLARI[konu] || [];
    for (var i = 0; i < modlar.length; i++) {
      if (modlar[i].key === modul) return modlar[i + 1] || null;
    }
    return null;
  }
  function pratikSonrakiModuleBaslat() {
    if (!currentPratik) return;
    var sonraki = pratikSonrakiModul(currentPratik.konu, currentPratik.modul);
    if (!sonraki) return;
    startPratikOturum(currentPratik.konu, sonraki.key, "siray");
  }

  function requestDeleteHistory(id) { deletingHistoryId = id; render(); }
  function cancelDeleteHistory() { deletingHistoryId = null; render(); }
  function deleteHistoryEntry(id) {
    var idx = -1;
    for (var i = 0; i < STATE.history.length; i++) { if (STATE.history[i].id === id) { idx = i; break; } }
    if (idx === -1) return;
    var entry = STATE.history[idx];
    STATE.history.splice(idx, 1);

    var bankByGuid = {};
    STATE.bank.forEach(function (q) { bankByGuid[q.guid] = q; });

    entry.sorular.forEach(function (guid) {
      var s = STATE.stats[guid];
      if (!s) return;
      var secilen = entry.cevaplar[guid];
      var q = oturumSorusu(entry, STATE.bank, guid);
      s.gosterim = Math.max(0, s.gosterim - 1);
      if (secilen !== undefined && secilen !== null && q) {
        if (secilen === q.cevapIdx) s.dogru = Math.max(0, s.dogru - 1);
        else s.yanlis = Math.max(0, s.yanlis - 1);
      }
      // bu silinen deneme, bu sorunun bilinen en son görülme anıysa kalan geçmişten yeniden bul
      if (s.sonGorulme === entry.tarihISO) {
        var bulundu = null;
        for (var j = 0; j < STATE.history.length; j++) {
          if (STATE.history[j].sorular.indexOf(guid) !== -1) { bulundu = STATE.history[j]; break; }
        }
        if (bulundu) {
          var sel = bulundu.cevaplar[guid];
          s.sonGorulme = bulundu.tarihISO;
          var oncekiSoru = oturumSorusu(bulundu, STATE.bank, guid);
          s.sonSonucDogruMu = (sel === undefined || sel === null) ? null : !!(oncekiSoru && sel === oncekiSoru.cevapIdx);
        } else if (s.gosterim === 0) {
          s.sonGorulme = null; s.sonSonucDogruMu = null;
        }
        // gösterim>0 ama eşleşen geçmiş yoksa (ör. Rastgele Soru'dan geldiyse) dokunma —
        // o kaydın ne zaman olduğunu ayrıca tutmuyoruz, olası son durumu bozmamak için elleme.
      }
    });

    deletingHistoryId = null;
    pendingSaveDirty = true; // ard arda birden çok kayıt silinebilir — her seferinde reload tetiklemesin
    render();
  }

  function openSettings() { draftSettings = JSON.parse(JSON.stringify(STATE.settings)); VIEW = "settings"; render(); }
  function updateDraftDagilim(konu, val) {
    var n = parseInt(val, 10);
    draftSettings.dagilim[konu] = isNaN(n) || n < 0 ? 0 : n;
    render();
  }
  function saveSettings() {
    STATE.settings = draftSettings;
    VIEW = "menu"; pendingSaveDirty = false; render();
    saveAndPublish();
  }

  function openImport() { importPreview = null; VIEW = "import"; render(); }
  function handleFileSelect(file) {
    file.arrayBuffer().then(function (buf) {
      return parseWorkbook(buf);
    }).then(function (res) {
      var bankRows = rowsToBankFormat(res.rows);
      if (bankRows.length === 0) throw new Error("Excel'de geçerli soru satırı bulunamadı.");
      var stateKopya = JSON.parse(JSON.stringify(STATE));
      var sonuc = mergeBankOnImport(stateKopya, bankRows);
      importPreview = { stateKopya: stateKopya, sonuc: sonuc, dosyaAdi: file.name, sheetName: res.sheetName, toplamSatir: bankRows.length };
      render();
    }).catch(function (e) {
      showBanner("Excel okunamadı: " + (e && e.message ? e.message : e), true);
    });
  }
  function confirmImport() {
    if (!importPreview) return;
    STATE = importPreview.stateKopya;
    STATE.meta.lastImportISO = new Date().toISOString();
    STATE.meta.kaynakDosyaAdi = importPreview.dosyaAdi;
    importPreview = null;
    VIEW = "menu"; pendingSaveDirty = false; render();
    saveAndPublish();
  }

  function showBanner(msg, isError) {
    bannerMsg = msg; bannerIsError = !!isError; render();
    setTimeout(function () { if (bannerMsg === msg) { bannerMsg = null; render(); } }, 7000);
  }

  // --------------------------------------------------------------- render --
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtTarih(iso) {
    try { var d = new Date(iso); return d.toLocaleDateString("tr-TR") + " " + d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return iso; }
  }

  function sinavDogruluk() {
    var toplam = 0, dogru = 0;
    STATE.history.forEach(function (h) {
      dogru += h.skor.dogru;
      toplam += h.skor.dogru + h.skor.yanlis + h.skor.bos;
    });
    if (toplam === 0) return null;
    return Math.round((dogru / toplam) * 100);
  }
  function flashDogruluk() {
    if (!STATE.flashOzet || STATE.flashOzet.gosterim === 0) return null;
    return Math.round((STATE.flashOzet.dogru / STATE.flashOzet.gosterim) * 100);
  }
  function renkEsigi(yuzde) {
    return yuzde === null ? "" : yuzde >= 70 ? "var(--good)" : yuzde >= 40 ? "var(--warn)" : "var(--bad)";
  }

  function renderMenu() {
    var toplamSoru = STATE.bank.length;

    var meta = STATE.meta.lastImportISO
      ? "Soru bankası son güncelleme: " + fmtTarih(STATE.meta.lastImportISO) + (STATE.meta.kaynakDosyaAdi ? " (" + escapeHtml(STATE.meta.kaynakDosyaAdi) + ")" : "")
      : "Soru bankası henüz yüklenmedi.";

    var pausedCard = "";
    if (STATE.pausedExam) {
      var pe = STATE.pausedExam;
      var cevaplanan = Object.keys(pe.cevaplar).length;
      var pausedActions = pausedDeleteConfirm
        ? '<div class="banner error" style="margin:10px 0">Bu sınav kalıcı olarak silinecek, emin misin?</div>' +
          '<div class="link-row">' +
          '<button class="btn primary" data-action="confirm-discard-paused">Evet, sil</button>' +
          '<button class="btn ghost" data-action="cancel-discard-paused">Vazgeç</button>' +
          "</div>"
        : '<div class="link-row" style="margin-top:10px">' +
          '<button class="btn primary" data-action="resume-exam">Devam Et</button>' +
          '<button class="btn ghost" data-action="discard-paused">Sil</button>' +
          "</div>";
      pausedCard = '<div class="card resume-card">' +
        '<div class="title">Yarım kalan sınav — ' + MOD_ADI[pe.tip] + "</div>" +
        '<div class="desc">' + cevaplanan + " / " + pe.sorular.length + " soru cevaplanmış · " + fmtTarih(pe.savedAtISO) + "</div>" +
        pausedActions + "</div>";
    }

    var hatirlaticiSayisi = Object.keys(STATE.flags).filter(function (g) { return STATE.flags[g].hatirlatici; }).length;
    var hataSayisi = Object.keys(STATE.flags).filter(function (g) { return STATE.flags[g].hatali; }).length;

    var navCards = '<div class="mode-grid">' +
      '<button class="mode-btn" style="border-left:4px solid var(--seri-2)" data-action="open-menu-test">' +
      '<div class="title">📚 Test</div><div class="desc">Modül modül konu çalışması ve rastgele tek soru pratiği.</div></button>' +
      '<button class="mode-btn" style="border-left:4px solid var(--seri-4)" data-action="open-checkpoint-liste">' +
      '<div class="title">📌 Checkpoint</div><div class="desc">Bölüm özetleri — numaralı, kaynak sayfalı checkpoint listeleriyle ufak ufak ezber.</div></button>' +
      "</div>";

    return '<div class="hero-band"><div class="masthead"><div><h1>UZYET</h1><div class="sub">' + meta + '</div></div></div></div>' +
      (toplamSoru === 0 ? '<div class="banner">Önce bir soru bankası içe aktarmalısın. Aşağıdan "Soru Bankasını Güncelle"yi kullan.</div>' : "") +
      pausedCard +
      navCards +
      '<div class="link-row">' +
      '<button class="btn" data-action="open-settings">Ayarlar</button>' +
      '<button class="btn" data-action="open-import">Soru Bankasını Güncelle</button>' +
      '<button class="btn" data-action="open-flags">İşaretliler (' + hatirlaticiSayisi + " 🔖 · " + hataSayisi + " 🚩)</button>" +
      '<button class="btn" data-action="open-duzeltmeler">✅ Düzeltilenler (' + STATE.duzeltmeler.length + ")</button>" +
      "</div>";
  }

  function renderMenuDeneme() {
    var toplamSoru = STATE.bank.length;
    var flashDisabled = (toplamSoru === 0 || (STATE.sadeceDeneme && !remoteGirisTamamMi())) ? "disabled" : "";

      '<button class="mode-btn" style="border-left:4px solid var(--seri-7)" ' + flashDisabled + ' data-action="start-flash">' +
      '<div class="title">🎲 Rastgele Soru</div><div class="desc">Tek soru, anında cevap — hızlı pratik veya keyfine bakmak için.</div></button>' +

      '<div class="title">📖 Konu Konu Bak</div><div class="desc">Sınav dışında, seçtiğin konudaki sorulara tek tek bak.</div></button>';

    var kullaniciHtml = remoteGirisTamamMi()

  // Ana ekrandaki "hatırlatıcı içeren sorular" kartı — yalnız giriş+onay+disclaimer
  // tamamsa (bank ve reminder listesi sunucudan çekilmiş olur) gösterilir.
  function hatirlaticiBolumHtml() {

      (guids.length
        ? '<div class="muted" style="margin-bottom:10px">Sınav sırasında 🔖 ile işaretlediğin sorular — buradan tekrar gözden geçirebilir veya Word\'e aktarabilirsin.</div>' +
          '<div class="link-row">' +
          '<button class="btn primary" data-action="start-hatirlatici-test">Test Başlat</button>' +
          '<button class="btn ghost" data-action="export-hatirlatici-word">📄 Word\'e Aktar</button>' +

        : '<div class="muted">Henüz hatırlatıcı olarak işaretlediğin bir soru yok — sınav sırasında bir sorunun altındaki 🔖 Hatırlatıcı butonuna basarak buraya ekleyebilirsin.</div>') +

  function yanlisSorularBolumHtml() {

    return '<div class="card" style="margin-top:14px">' +

      (guids.length
        ? '<div class="muted" style="margin-bottom:10px">Tamamladığın denemelerde son cevabın yanlış olan sorular. Sorular karışık gelir; burada doğru çözdüklerin havuzdan çıkar.</div>' +
          '<div class="link-row"><button class="btn primary" data-action="start-yanlis-tekrar-test">Test Başlat</button></div>'
        : '<div class="muted">Bekleyen yanlış sorun yok. Bir denemede yanlış yaptığın sorular burada görünecek.</div>') +
      "</div>";
